id: PH2
file: phase-2-perception-editing-core
name: Perception Engine and Editing Core
sprints: [3, 4]
release: v0.2 "Understand and Cut"
scope: mvp
objective: >
  Give the system a structured, versioned and cached understanding of raw footage (speech, audio and visual
  perception unified into one MediaAnalysis document), and in parallel build the editing core it will act on - a
  serializable timeline domain with undo/redo commands, a render engine with FFmpeg and Remotion strategies behind
  one interface, and the Editing Tool SDK. The phase is proven by the first automated, non-AI edit - one-click
  silence removal executed through the Tool SDK and rendered to MP4. Covers original Phases 3, 4 (core) and 5 (core),
  and runs perception and editing-core work in parallel lanes instead of sequentially.
depends_on: [PH1]
dependency_notes:
  - US-201 needs the 16 kHz audio produced by US-128 and the queue from US-129.
  - The Tool SDK (US-219, US-221) is the contract the agent will use in PH3; it is frozen at the end of Sprint 4 with contract tests.
  - The MediaAnalysis schema (US-208) is the contract between Python analyzers and TypeScript consumers; analyzers in Sprints 3-4 code against it from day 1.
  - External - GPU runner for nightly model tests (CPU int8 models are used in PR CI).
deliverables:
  - Word-level transcription with language detection, confidence scores and VAD
  - Filler-word and repetition detection
  - Silence, loudness (EBU R128), peak and energy analysis
  - Shot detection and face detection/tracking
  - Versioned MediaAnalysis JSON Schema with generated TS (zod) and Python (pydantic) bindings, plus the aggregated document per asset
  - Transcript viewer, analysis overview and frame-accurate player in the web app
  - Timeline domain model and Command-based edit history with undo/redo
  - Render worker with FFmpeg and Remotion strategies behind IRenderStrategy
  - Tool SDK core (manifest, registry, validation, executor) and FFmpeg editing tools
  - One-click silence removal workflow with automated E2E test
definition_of_done:
  - Checkpoint CP2 perception quality gate passed and results stored in the evaluation report
  - Every analyzer writes schema-valid output with provenance (analyzer, model, version, parameters) and is covered by fixture-based tests
  - The timeline domain package has at least 90 percent line coverage and property-based tests for command/undo symmetry
  - Tool SDK contract tests are green and the SDK interfaces are tagged v1 (frozen for PH3)
  - No FFmpeg command is built by string concatenation; all go through the command builder with argument arrays
  - Silence-removal E2E test passes in CI; v0.2 is tagged and deployed to staging
  - Developer documentation exists for adding a new analyzer and a new tool
epics:
  - id: EP-06
    name: Speech Understanding
    goal: Produce accurate, word-timed transcripts and speech segmentation that editing decisions can trust.
    depends_on: [EP-05]
    features:
      - id: FT-06.1
        name: Transcription and Speech Segmentation
        stories:
          - id: US-201
            title: Word-level transcription with Faster-Whisper
            story: As an AI video editor, I want accurate word timestamps, language and confidence for all speech, so that I can cut on word boundaries and synchronize captions precisely.
            priority: P0
            points: 8
            sprint: 3
            lane: AI
            depends_on: [US-105, US-128, US-129]
            tasks:
              - Define the ITranscriber port and a FasterWhisperAdapter (configurable model, device, compute type; CPU int8 fallback)
              - Enable word-level timestamps, per-word probability and automatic language detection with confidence
              - Use Silero VAD filtering and chunked processing for long files with deterministic segment merging
              - Map output to the Transcript, Segment and Word schema types and record model name, version and parameters as provenance
              - Implement the transcription job handler in ai-worker with progress reporting
              - +test Fixture tests for timestamps monotonicity and WER against hand-aligned clips
              - +int Nightly GPU test with the production model; PR CI uses the tiny int8 model
            acceptance:
              - Given a 10-minute English clip, when transcribed, then every word has start, end and confidence and the WER is at most 12 percent on evaluation clips
              - Language is detected automatically and Arabic results are measured and recorded
              - The same input and model version produce identical output (deterministic settings)
          - id: US-202
            title: Voice activity detection and speech segmentation
            story: As an AI video editor, I want precise speech and non-speech regions, so that silence removal never cuts into speech.
            priority: P0
            points: 3
            sprint: 3
            lane: AI
            depends_on: [US-128]
            tasks:
              - Implement IVoiceActivityDetector with a Silero VAD adapter and configurable thresholds and padding
              - Output speech regions with confidence into the analysis schema
              - +test Compare against labelled ranges and report precision and recall
            acceptance:
              - Speech-region F1 is at least 0.9 on the labelled evaluation clips
              - Thresholds are configuration values, not constants in code
      - id: FT-06.2
        name: Disfluency Detection
        stories:
          - id: US-203
            title: Filler-word and repetition detection
            story: As an AI video editor, I want filler words, false starts and repeated phrases marked in the transcript, so that I can remove them cleanly.
            priority: P0
            points: 3
            sprint: 4
            lane: AI
            depends_on: [US-201]
            tasks:
              - Build per-language filler lexicons (English and Arabic) loaded from data files
              - Detect repeated n-grams and restarts within a sliding window using word timestamps
              - Emit tagged spans with type and confidence in the analysis document
              - +test Unit tests on synthetic transcripts and one labelled real clip
            acceptance:
              - Filler spans are word-aligned and never split a non-filler word
              - Precision is at least 0.85 on the labelled clip
  - id: EP-07
    name: Audio Understanding
    goal: Measure the audio signal so the editor can cut, balance and evaluate sound objectively.
    depends_on: [EP-05]
    features:
      - id: FT-07.1
        name: Audio Metrics
        stories:
          - id: US-204
            title: Silence, loudness, peak and energy analysis
            story: As an AI video editor, I want silence ranges, loudness and energy over time, so that I can remove dead air and balance audio to platform targets.
            priority: P0
            points: 5
            sprint: 3
            lane: MM
            depends_on: [US-128]
            tasks:
              - Define IAudioAnalyzer and implement FFmpeg silencedetect and ebur128 analysis (integrated LUFS, short-term loudness, true peak, loudness range)
              - Compute a downsampled RMS energy curve and peak list
              - Generate waveform peak data for the UI
              - Write results to the AudioAnalysis section with provenance
              - +test Fixture tests with known silence gaps and a calibrated loudness tone
            acceptance:
              - Silence detection F1 is at least 0.9 against labelled ranges
              - Integrated loudness of the calibration fixture is within 0.5 LU of the reference value
      - id: FT-07.2
        name: Audio Classification
        stories:
          - id: US-205
            title: Speech, music and noise classification
            story: As an AI video editor, I want to know where music, speech and background noise occur, so that I can avoid cutting music abruptly and detect noisy sections.
            priority: P2
            points: 3
            sprint: stretch
            lane: MM
            depends_on: [US-204]
            tasks:
              - Integrate a pretrained audio event classifier (YAMNet or PANNs) behind IAudioClassifier
              - Output labelled segments and a noise-floor estimate
              - +test Fixture test with speech-over-music and noise segments
            acceptance:
              - Speech, music and noise segments are labelled with confidence on the fixture
              - The classifier can be replaced by another adapter without changing consumers
  - id: EP-08
    name: Visual Understanding
    goal: Understand shots and people on screen so that cuts and framing respect the picture.
    depends_on: [EP-05]
    features:
      - id: FT-08.1
        name: Shot and Scene Detection
        stories:
          - id: US-206
            title: Shot and scene boundary detection
            story: As an AI video editor, I want shot boundaries, so that I avoid cutting in the middle of camera movements and can align transitions.
            priority: P0
            points: 3
            sprint: 4
            lane: MM
            depends_on: [US-128, US-208]
            tasks:
              - Implement ISceneDetector with a PySceneDetect adapter (content and adaptive detectors) on the proxy
              - Output shots with start, end, confidence and a representative keyframe
              - +test Fixture test with known hard cuts and a fade
            acceptance:
              - All hard cuts in the fixture are detected within 2 frames
              - Detector thresholds are configurable per analysis request
      - id: FT-08.2
        name: Face Detection and Tracking
        stories:
          - id: US-207
            title: Face detection and tracking
            story: As an AI video editor, I want face positions tracked over time, so that I can reframe to vertical formats and avoid covering faces with graphics.
            priority: P0
            points: 8
            sprint: 4
            lane: AI
            depends_on: [US-128, US-208]
            tasks:
              - Define IFaceDetector and IFaceTracker; implement a detector adapter (MediaPipe or SCRFD) on sampled proxy frames
              - Implement IoU/ByteTrack tracking with stable track IDs and temporal smoothing
              - Output per-track bounding boxes over time normalized to source resolution
              - Support GPU and CPU execution with a configurable sampling rate
              - +test Fixture tests with one and two speakers measuring track continuity
            acceptance:
              - Faces in the two-speaker fixture keep stable track IDs across the clip
              - Boxes are normalized to source coordinates, including rotated sources
              - A 10-minute video is processed in under 5 minutes on the reference GPU
  - id: EP-09
    name: Unified Media Analysis
    goal: Merge all perception outputs into one versioned, schema-validated MediaAnalysis document per asset.
    depends_on: [EP-05]
    features:
      - id: FT-09.1
        name: Cross-Language Contracts and Test Harness
        stories:
          - id: US-208
            title: Versioned MediaAnalysis JSON Schema with generated bindings
            story: As a developer on any worker, I want one versioned schema for analysis results, so that Python analyzers and TypeScript consumers cannot drift apart.
            priority: P0
            points: 3
            sprint: 3
            lane: OPS
            depends_on: [US-103]
            tasks:
              - Author JSON Schemas in packages/schemas for transcript, scenes, faces, objects, audio, metadata and provenance
              - Generate zod (TS) and pydantic (Python) types in the build and fail CI on uncommitted drift
              - Define the schema versioning and migration policy (semver, additive changes only within a major version)
              - +test Contract tests validating sample documents in both languages
              - +doc Document the schema and the versioning policy
            acceptance:
              - Changing a schema without regenerating bindings fails CI
              - A document produced by Python validates in TypeScript and vice versa
          - id: US-209
            title: Worker integration test harness and GPU test strategy
            story: As a developer, I want integration tests that exercise workers through the real queue and storage, so that cross-service bugs are caught before merge.
            priority: P0
            points: 3
            sprint: 3
            lane: OPS
            depends_on: [US-116]
            tasks:
              - Build a harness that enqueues a job, runs the worker in a container and asserts outputs in storage and database
              - +ci Tag tests as cpu or gpu; run cpu in PR CI and gpu nightly on a self-hosted runner
              - +ci Cache model weights between CI runs
              - +doc Document how to write a worker integration test
            acceptance:
              - Transcription and audio analysis integration tests run in PR CI on CPU in under 5 minutes
              - The nightly GPU job reports results to the team channel
      - id: FT-09.2
        name: Analysis Orchestration
        stories:
          - id: US-210
            title: Analysis orchestration and aggregation
            story: As the system, I want every uploaded asset analysed by all analyzers and merged into one MediaAnalysis, so that the agent has a single source of understanding.
            priority: P0
            points: 3
            sprint: 3
            lane: MM
            depends_on: [US-208, US-129]
            tasks:
              - Trigger analyzer jobs automatically after proxy and audio extraction complete
              - Aggregate analyzer results into a versioned MediaAnalysis document stored per asset
              - Handle partial failure (document marks missing sections with reasons) and allow re-running one analyzer
              - Expose GET /media/{id}/analysis
              - +test Integration test covering success, one-analyzer failure and re-run
            acceptance:
              - An upload produces a MediaAnalysis document that validates against the schema
              - If one analyzer fails, the others still complete and the document records the failure
      - id: FT-09.3
        name: Analysis Experience in the Web App
        stories:
          - id: US-211
            title: Frame-accurate video player component
            story: As a creator, I want a precise player with frame stepping, so that I can review exactly what the AI understood and changed.
            priority: P0
            points: 3
            sprint: 3
            lane: FE
            depends_on: [US-125]
            tasks:
              - Build a reusable player on the proxy with frame stepping, keyboard shortcuts and timecode display
              - Expose a seek and time-update API for synchronized panels
              - +test Component tests for seeking and time updates
            acceptance:
              - Frame stepping moves exactly one frame at the proxy frame rate
              - Other components can subscribe to the current time
          - id: US-212
            title: Synchronized transcript viewer
            story: As a creator, I want to read the transcript in sync with the video, so that I can verify what was said and navigate by words.
            priority: P0
            points: 3
            sprint: 3
            lane: FE
            depends_on: [US-201, US-211]
            tasks:
              - Render transcript segments with active-word highlighting during playback
              - Click a word to seek; show low-confidence words distinctly
              - Virtualize the list for long transcripts
              - +test Component tests and an E2E check on the fixture
            acceptance:
              - Clicking a word seeks within one frame of its start time
              - A 60-minute transcript scrolls smoothly
          - id: US-213
            title: Analysis overview panels
            story: As a creator, I want to see silences, shots, faces and filler words on a time ruler, so that I understand the footage before editing.
            priority: P1
            points: 3
            sprint: 4
            lane: FE
            depends_on: [US-210, US-206, US-207]
            tasks:
              - Render lanes for waveform, silence, shots and filler words aligned to the player
              - Overlay face boxes on the player (toggle)
              - +test Component tests with a fixture MediaAnalysis document
            acceptance:
              - All lanes align with the player timecode
              - Missing analysis sections show their failure reason instead of empty lanes
  - id: EP-10
    name: Editing Project Model
    goal: Represent every edit as structured, serializable, undoable project state rather than only an output file.
    depends_on: [EP-01]
    features:
      - id: FT-10.1
        name: Timeline Domain and Commands
        stories:
          - id: US-214
            title: Timeline domain model and invariants
            story: As an AI video editor, I want the edit represented as a typed timeline of tracks and clips, so that I can reason about and change it precisely.
            priority: P0
            points: 5
            sprint: 3
            lane: BE
            depends_on: [US-104]
            tasks:
              - Implement Project, Timeline, Track (video, overlay, graphics, caption, audio), Clip, Effect, Transition, Caption, AudioClip and ComponentInstance in packages/domain
              - Represent time as integer microseconds with frame snapping at the composition frame rate (ADR-008)
              - Enforce invariants (no illegal overlaps per track type, source ranges within asset duration, positive durations)
              - Define the project.json schema in packages/schemas with a version field
              - +test Unit and property-based tests (fast-check) for invariants and serialization round-trips
            acceptance:
              - The domain package has zero framework imports and at least 90 percent coverage
              - Any timeline serializes to project.json and deserializes to an equal value
          - id: US-215
            title: Edit commands with undo, redo and replayable history
            story: As a creator and as the agent, I want every edit to be a reversible command, so that changes can be undone, replayed and audited.
            priority: P0
            points: 5
            sprint: 3
            lane: BE
            depends_on: [US-214]
            tasks:
              - Implement the Command pattern (TrimClip, SplitClip, MoveClip, DeleteRange with ripple, InsertClip, SetProperty, AddCaption) with inverse commands
              - Implement a CommandBus with history stack, undo and redo, and a persisted command log
              - Rebuild a timeline by replaying the log from a snapshot
              - +test Property tests proving apply followed by undo restores the original state
            acceptance:
              - For any generated command sequence, undoing all commands returns the initial timeline
              - Replaying the persisted log reproduces the same timeline
  - id: EP-11
    name: Rendering Engine
    goal: Render any timeline through interchangeable render strategies with progress and validation.
    depends_on: [EP-05, EP-10]
    features:
      - id: FT-11.1
        name: Render Worker
        stories:
          - id: US-216
            title: Remotion render worker
            story: As the system, I want a render worker that turns composition props into a video file, so that programmatic graphics can be rendered headlessly.
            priority: P0
            points: 5
            sprint: 3
            lane: GEN
            depends_on: [US-106, US-129]
            tasks:
              - Scaffold the Remotion project inside render-worker with a root composition taking typed props
              - Consume render jobs, bundle once per version, call renderMedia with concurrency and timeout, upload outputs
              - Report per-frame progress through job events and support cancellation
              - Run headless Chromium in a container without root
              - +test Integration test rendering a 5-second composition and validating it with FFprobe
            acceptance:
              - A render job with valid props produces an MP4 whose duration, resolution and fps match the props
              - Cancelling a render stops Chromium and frees resources
      - id: FT-11.2
        name: Render Strategies
        stories:
          - id: US-217
            title: Timeline to Remotion composition mapping
            story: As the render system, I want any timeline mapped to a Remotion composition, so that clips, captions and graphics render from the single source of truth.
            priority: P0
            points: 5
            sprint: 4
            lane: GEN
            depends_on: [US-214, US-216]
            tasks:
              - Implement a RemotionRenderStrategy that maps tracks and clips to Sequence and OffthreadVideo elements with frame-accurate offsets
              - Map caption and graphics tracks to registered component types through a component factory
              - Resolve asset URLs through short-lived signed URLs
              - +test Golden tests rendering fixture timelines and comparing frame hashes at key timestamps
            acceptance:
              - Clip boundaries in the output are frame-accurate relative to project.json
              - Unknown component types fail validation before rendering starts
          - id: US-218
            title: FFmpeg render strategy behind IRenderStrategy
            story: As the render system, I want a fast FFmpeg path for cut-only edits, so that simple edits render in a fraction of the Remotion time.
            priority: P0
            points: 5
            sprint: 4
            lane: GEN
            depends_on: [US-214, US-220]
            tasks:
              - Define IRenderStrategy and a strategy selector (Strategy pattern) based on timeline features
              - Implement FFmpegRenderStrategy using the command builder (trim, concat, audio crossfades at cuts)
              - Validate outputs (duration, streams, codecs) with FFprobe after every render
              - +test Parity tests proving FFmpeg and Remotion strategies output the same cut points for a cut-only timeline
            acceptance:
              - A cut-only timeline is rendered by FFmpeg and a timeline with graphics by Remotion, automatically
              - Both strategies satisfy the same contract test suite (Liskov substitution)
  - id: EP-12
    name: Editing Tool SDK and Media Operations
    goal: Expose editing capabilities to automation and AI only through typed, validated, permissioned and extensible tools.
    depends_on: [EP-10]
    features:
      - id: FT-12.1
        name: Tool SDK Core
        stories:
          - id: US-219
            title: Tool manifest, registry and schema validation
            story: As an agent developer, I want every tool described by a manifest with schemas, permissions, cost and timeout, so that tools can be discovered, validated and added without changing the agent.
            priority: P0
            points: 5
            sprint: 4
            lane: BE
            depends_on: [US-103, US-208]
            tasks:
              - Define ToolManifest (name, version, description, input and output JSON Schema, permissions, estimated cost, timeout, validation rules, capability tags) in packages/tool-sdk
              - Define segregated interfaces (ITool plus capability interfaces such as IRenderTool, IAudioTool, IVisionTool, ITranscriptionTool)
              - Implement the ToolRegistry with dynamic registration, versioning, lookup by capability and export of manifests to LLM function-calling format
              - Validate every input and output against its schema with actionable error messages
              - +test Unit tests for registration, lookup, validation errors and manifest export
              - +doc Write docs/tool-sdk/adding-a-tool.md
            acceptance:
              - A new tool is added by registering a manifest and implementation, with no change to registry or agent code
              - Invalid input is rejected with a message naming the field and rule
          - id: US-221
            title: Tool executor with permissions, timeouts and remote dispatch
            story: As the platform, I want a single executor that enforces permissions, timeouts and cost limits for every tool call, so that automation cannot exceed its authority or hang.
            priority: P0
            points: 5
            sprint: 4
            lane: BE
            depends_on: [US-219]
            tasks:
              - Implement ToolExecutor with permission checks against the caller context, per-call timeout and cancellation
              - Support in-process tools and queue-dispatched remote tools (media-worker, ai-worker, render-worker) through one interface
              - Emit structured execution records (tool, input hash, duration, result status, cost) as events
              - Convert tool results into timeline commands for mutating tools
              - +test Tests for permission denial, timeout, remote failure and command generation
              - +sec Deny any tool that requests shell, arbitrary filesystem or network permissions not declared in its manifest
            acceptance:
              - A tool exceeding its timeout is cancelled and reported as failed
              - A caller without the required permission receives a denial and no side effects occur
              - Every execution produces a record that can be queried later
      - id: FT-12.2
        name: FFmpeg Media Operations
        stories:
          - id: US-220
            title: Safe FFmpeg command builder
            story: As a multimedia engineer, I want a typed FFmpeg command builder, so that commands are never duplicated or built from unsafe strings.
            priority: P0
            points: 3
            sprint: 3
            lane: MM
            depends_on: [US-126]
            tasks:
              - Implement a fluent builder in packages/media-core for inputs, filter graphs, maps and encoders with escaping of filter arguments
              - Run FFmpeg via argument arrays with progress parsing, timeout and resource limits
              - Provide reusable presets (proxy, preview, social 1080p H.264/AAC)
              - +sec Reject filter names and protocols not on the allow-list
              - +test Snapshot tests of generated argument arrays and an escaping fuzz test
            acceptance:
              - No code outside media-core invokes FFmpeg directly (enforced by a lint rule)
              - Malicious strings in text or path fields cannot inject extra arguments or filters
          - id: US-222
            title: Core FFmpeg editing tools
            story: As the agent, I want trim, split, concat, crop, resize, speed and audio-normalization tools, so that basic editing operations are available through the SDK.
            priority: P0
            points: 5
            sprint: 4
            lane: MM
            depends_on: [US-219, US-220]
            tasks:
              - Implement trim_video, split_video, concat_clips, crop_video, resize_video, change_speed and normalize_audio as SDK tools with manifests
              - Mutating tools return timeline commands; media-producing tools return DerivedAssets
              - +test Unit tests for manifests and integration tests on fixtures for each tool
            acceptance:
              - Every tool validates its input schema and has at least one integration test
              - Tools never overwrite source assets
      - id: FT-12.3
        name: First Automated Edit
        description: A deterministic, non-AI workflow that proves analysis, commands, tools and rendering work together.
        stories:
          - id: US-223
            title: One-click silence removal workflow
            story: As a creator, I want to remove all silences with one click, so that I get a tighter video immediately and the team proves the full edit pipeline.
            priority: P0
            points: 3
            sprint: 4
            lane: MM
            depends_on: [US-204, US-215, US-218, US-221, US-222]
            tasks:
              - Implement the RemoveSilences application use case - read MediaAnalysis, compute keep ranges with padding, snap to word boundaries
              - Execute DeleteRange commands through the ToolExecutor and create a project version
              - Trigger a render and link the output to the project
              - +test Integration test verifying no word from the transcript is cut
            acceptance:
              - The rendered output is shorter by the detected silence minus padding, within one frame
              - No transcript word is truncated in the output
          - id: US-224
            title: Silence removal action and result download in the web app
            story: As a creator, I want a button to run silence removal and a way to preview and download the result, so that I can use the first automated edit.
            priority: P0
            points: 3
            sprint: 4
            lane: FE
            depends_on: [US-223]
            tasks:
              - Add the Remove silences action with padding options to the project page
              - Show render progress and play and download the result
              - +test Component tests against the API contract mock
            acceptance:
              - A user can trigger the workflow, watch progress and download the MP4 without leaving the page
              - Errors from the workflow are shown with a retry option
          - id: US-225
            title: End-to-end test of the silence removal workflow
            story: As the team, I want the first automated edit covered by an E2E test, so that later changes cannot silently break the pipeline.
            priority: P0
            points: 2
            sprint: 4
            lane: OPS
            depends_on: [US-117, US-223, US-224]
            tasks:
              - Create the silence-gap fixture with known expected output duration and word list
              - +test Playwright test - upload silence fixture, run removal, wait for render, assert output duration via API
              - +ci Add the test to the E2E suite with CPU models
            acceptance:
              - The E2E test passes in CI and fails if any stage of analysis, tools or rendering breaks
              - Test runtime stays under 6 minutes
