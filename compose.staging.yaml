# EditAgent staging runtime (US-113).
# This file is separate from the local development stack in compose.yaml.
# It has no credential fallbacks and no build steps. Images must be digest-pinned.
# `docker compose up` does not start the GPU service. NVIDIA remains opt-in:
#   docker compose --profile gpu -f compose.staging.yaml up --scale ai-worker=0
#
# Do not run `docker compose down -v` here. That deletes staging data.

name: editagent-staging

x-database-url: &database-url postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

x-object-storage: &object-storage
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}

x-ai-environment: &ai-environment
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379/0
  <<: *object-storage
  EDITAGENT_AI_DEVICE: cpu

services:
  postgres:
    image: ${EDITAGENT_POSTGRES_IMAGE:?EDITAGENT_POSTGRES_IMAGE is required}
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${EDITAGENT_REDIS_IMAGE:?EDITAGENT_REDIS_IMAGE is required}
    pull_policy: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: ${EDITAGENT_MINIO_IMAGE:?EDITAGENT_MINIO_IMAGE is required}
    pull_policy: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - staging-minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${EDITAGENT_API_IMAGE:?EDITAGENT_API_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      PORT: "3001"
      HOST: "0.0.0.0"
      MEDIA_INSPECT_QUEUE: ${MEDIA_INSPECT_QUEUE:?MEDIA_INSPECT_QUEUE is required}
      <<: *object-storage
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${EDITAGENT_WEB_IMAGE:?EDITAGENT_WEB_IMAGE is required}
    pull_policy: always
    environment:
      API_BASE_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${STAGING_BIND_IP:?STAGING_BIND_IP is required}:${STAGING_WEB_PORT:?STAGING_WEB_PORT is required}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  agent-worker:
    image: ${EDITAGENT_AGENT_WORKER_IMAGE:?EDITAGENT_AGENT_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  media-worker:
    image: ${EDITAGENT_MEDIA_WORKER_IMAGE:?EDITAGENT_MEDIA_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "3200"
      MEDIA_INSPECT_QUEUE: ${MEDIA_INSPECT_QUEUE:?MEDIA_INSPECT_QUEUE is required}
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  render-worker:
    image: ${EDITAGENT_RENDER_WORKER_IMAGE:?EDITAGENT_RENDER_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ai-worker:
    image: ${EDITAGENT_AI_WORKER_IMAGE:?EDITAGENT_AI_WORKER_IMAGE is required}
    pull_policy: always
    environment: *ai-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:3200/ready'); sys.exit(0)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Optional GPU profile. The default staging stack does not start this service.
  ai-worker-gpu:
    profiles: ["gpu"]
    image: ${EDITAGENT_AI_WORKER_IMAGE:?EDITAGENT_AI_WORKER_IMAGE is required}
    pull_policy: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *ai-environment
      EDITAGENT_AI_DEVICE: cuda
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:3200/ready'); sys.exit(0)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  staging-postgres-data:
  staging-redis-data:
  staging-minio-data:
