# EditAgent staging runtime (US-113).
# This file is separate from the local development stack in compose.yaml.
# It has no credential fallbacks and no build steps. Images must be digest-pinned.
# `docker compose up` does not start the GPU service. NVIDIA remains opt-in:
#   docker compose --profile gpu -f compose.staging.yaml up --scale ai-worker=0
#
# Do not run `docker compose down -v` here. That deletes staging data.

name: editagent-staging

x-database-url: &database-url postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}

x-seaweed-image: &seaweed-image ${EDITAGENT_SEAWEEDFS_IMAGE:?EDITAGENT_SEAWEEDFS_IMAGE is required}

x-object-storage: &object-storage
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}

x-ai-environment: &ai-environment
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379/0
  <<: *object-storage
  EDITAGENT_AI_DEVICE: cpu

services:
  postgres:
    image: ${EDITAGENT_POSTGRES_IMAGE:?EDITAGENT_POSTGRES_IMAGE is required}
    pull_policy: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${EDITAGENT_REDIS_IMAGE:?EDITAGENT_REDIS_IMAGE is required}
    pull_policy: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  master:
    image: *seaweed-image
    pull_policy: if_not_present
    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -port=9333
      - -mdir=/data
      - -telemetry=false
    networks: [storage_internal]
    volumes:
      - staging-seaweed-master:/data
      - ${SEAWEED_SECRET_DIR:?SEAWEED_SECRET_DIR is required}/security.toml:/etc/seaweedfs/security.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/dir/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  volume:
    image: *seaweed-image
    pull_policy: if_not_present
    command:
      - volume
      - -dir=/data
      - -max=8
      - -mserver=master:9333
      - -ip=volume
      - -ip.bind=0.0.0.0
      - -port=8080
    networks: [storage_internal]
    volumes:
      - staging-seaweed-volume:/data
      - ${SEAWEED_SECRET_DIR:?SEAWEED_SECRET_DIR is required}/security.toml:/etc/seaweedfs/security.toml:ro
    depends_on:
      - master
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://volume:8080/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  filer:
    image: *seaweed-image
    pull_policy: if_not_present
    command:
      - filer
      - -master=master:9333
      - -ip=filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -defaultStoreDir=/data
      - -disableDirListing
    networks: [storage_internal]
    volumes:
      - staging-seaweed-filer:/data
      - ${SEAWEED_SECRET_DIR:?SEAWEED_SECRET_DIR is required}/security.toml:/etc/seaweedfs/security.toml:ro
    depends_on:
      - volume
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://filer:8888/ 2>&1 | grep -q HTTP/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3:
    image: *seaweed-image
    pull_policy: if_not_present
    command:
      - s3
      - -filer=filer:8888
      - -ip.bind=0.0.0.0
      - -port=8333
      - -port.iceberg=0
      - -port.lance=0
      - -iam=false
      - -config=/etc/seaweedfs/s3.json
    networks: [default, storage_internal]
    volumes:
      - ${SEAWEED_SECRET_DIR:?SEAWEED_SECRET_DIR is required}/security.toml:/etc/seaweedfs/security.toml:ro
      - ${SEAWEED_SECRET_DIR:?SEAWEED_SECRET_DIR is required}/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      - filer
    # No host port. Object Ingress is the external object entry point.
    # The host firewall drops this container's other listeners and the
    # internal storage subnet. Unpublished ports alone are not isolation.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  object-ingress:
    image: ${EDITAGENT_OBJECT_INGRESS_IMAGE:?EDITAGENT_OBJECT_INGRESS_IMAGE is required}
    pull_policy: always
    environment:
      MINIO_UPSTREAM: http://s3:8333
      PORT: "8080"
    ports:
      - "${STAGING_BIND_IP:?STAGING_BIND_IP is required}:${STAGING_OBJECTS_PORT:?STAGING_OBJECTS_PORT is required}:8080"
    depends_on:
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    image: ${EDITAGENT_API_IMAGE:?EDITAGENT_API_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      PORT: "3001"
      HOST: "0.0.0.0"
      MEDIA_INSPECT_QUEUE: ${MEDIA_INSPECT_QUEUE:?MEDIA_INSPECT_QUEUE is required}
      <<: *object-storage
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${EDITAGENT_WEB_IMAGE:?EDITAGENT_WEB_IMAGE is required}
    pull_policy: always
    environment:
      API_BASE_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${STAGING_BIND_IP:?STAGING_BIND_IP is required}:${STAGING_WEB_PORT:?STAGING_WEB_PORT is required}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  agent-worker:
    image: ${EDITAGENT_AGENT_WORKER_IMAGE:?EDITAGENT_AGENT_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  media-worker:
    image: ${EDITAGENT_MEDIA_WORKER_IMAGE:?EDITAGENT_MEDIA_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "3200"
      MEDIA_INSPECT_QUEUE: ${MEDIA_INSPECT_QUEUE:?MEDIA_INSPECT_QUEUE is required}
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  render-worker:
    image: ${EDITAGENT_RENDER_WORKER_IMAGE:?EDITAGENT_RENDER_WORKER_IMAGE is required}
    pull_policy: always
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ai-worker:
    image: ${EDITAGENT_AI_WORKER_IMAGE:?EDITAGENT_AI_WORKER_IMAGE is required}
    pull_policy: always
    environment: *ai-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:3200/ready'); sys.exit(0)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Optional GPU profile. The default staging stack does not start this service.
  ai-worker-gpu:
    profiles: ["gpu"]
    image: ${EDITAGENT_AI_WORKER_IMAGE:?EDITAGENT_AI_WORKER_IMAGE is required}
    pull_policy: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *ai-environment
      EDITAGENT_AI_DEVICE: cuda
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:3200/ready'); sys.exit(0)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

networks:
  default:
    enable_ipv6: false
  storage_internal:
    name: editagent-staging-storage-internal
    enable_ipv6: false
    internal: true

volumes:
  staging-postgres-data:
  staging-redis-data:
  # staging-minio-data is not declared. An existing volume must be copied
  # through the S3 API and must not be deleted by Compose.
  staging-seaweed-master:
  staging-seaweed-volume:
  staging-seaweed-filer:
