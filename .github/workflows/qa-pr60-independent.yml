# Independent QA for PR #60 (US-201/US-210). QA-only branch; never merged.
# The application under test is the immutable PR head, checked out separately
# from this harness. No secrets are used; artifacts are sanitized summaries.
name: QA PR60 independent

on:
  push:
    branches: [qa/pr60-d1e131e]

permissions:
  contents: read

concurrency:
  group: qa-pr60-independent
  cancel-in-progress: false

env:
  QA_APP_SHA: d1e131e08019300506c15653deeec71edb455afe
  QA_APP_TREE: 374ef49dfb4f5d2cf56e1c76259853ada44ff2dd

jobs:
  compose-blackbox:
    name: QA-F1 US-210 real services + QA-F2 browser-to-export (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COMPOSE_PROJECT_NAME: qapr60
      EDITAGENT_RUNTIME: development
      AUTH_COOKIE_SECURE: "false"
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out application at the immutable PR head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          persist-credentials: false
      - name: Check out QA harness (separate directory)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr60
          persist-credentials: false
      - name: Verify exact application identity
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          test "$(git -C app rev-parse 'HEAD^{tree}')" = "$QA_APP_TREE"
          test -z "$(git -C app status --porcelain)"
          mkdir -p qa-out
          printf '{"appSha":"%s","appTree":"%s","qaHarnessSha":"%s","runId":"%s"}\n' \
            "$(git -C app rev-parse HEAD)" "$(git -C app rev-parse 'HEAD^{tree}')" "$GITHUB_SHA" "$GITHUB_RUN_ID" > qa-out/identity.json
          cat qa-out/identity.json
      - name: Runner, Docker and capacity
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          { echo "nproc=$(nproc)"; free -b | sed -n 2p; df -B1 / | tail -1; uname -sr;
            docker version --format 'docker client={{.Client.Version}} server={{.Server.Version}}';
            docker compose version; lsb_release -ds; } | tee qa-out/runner.txt
          test "$(nproc)" -ge 4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pinned workspace dependencies
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @editagent/schemas build
      - name: Install FFmpeg and Chrome (repository scripts)
        working-directory: app
        run: |
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --quiet numpy==2.3.3
      - name: Stage QA harness outside tracked application files
        run: |
          set -eu
          mkdir -p app/apps/web/.qa-pr60
          cp qa-src/qa/pr60/* app/apps/web/.qa-pr60/
          git -C app status --porcelain --untracked-files=all | tee qa-out/app-status-after-staging.txt
          # Only the isolated untracked harness directory may differ from the PR head.
          ! git -C app status --porcelain --untracked-files=all | grep -v '^?? apps/web/.qa-pr60/'
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
      - name: Generate QA media inputs
        run: bash qa-src/qa/pr60/make_inputs.sh "$RUNNER_TEMP/qa-inputs" app
      - name: Build production images (repository Dockerfiles)
        working-directory: app
        run: |
          set -eu
          docker compose config --quiet
          docker compose build postgres redis api web media-worker ai-worker render-executor render-worker
          rv="$(docker run --rm --entrypoint node editagent-render-worker:local -p "require('./dist/bundle/catalog.json').renderVersion")"
          echo "EDITAGENT_RENDER_VERSION=$rv" >> "$GITHUB_ENV"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}' | grep editagent | tee -a ../qa-out/runner.txt
      - name: Start real Compose stack
        working-directory: app
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 180 postgres redis
          sh infra/seaweedfs/start-storage.sh --from-boot
          node apps/web/.qa-pr60/bucket.mjs
          docker compose up -d --no-build --wait --wait-timeout 420 api web media-worker ai-worker render-executor render-worker
          docker compose ps --format '{{.Service}} {{.State}} {{.Health}}' | tee ../qa-out/compose-ps.txt
          { docker compose exec -T postgres postgres --version; docker compose exec -T redis redis-server --version; } | tee -a ../qa-out/runner.txt
      - name: Independent probes (US-210 real services + browser-to-export)
        working-directory: app/apps/web
        env:
          QA_APP_ROOT: ${{ github.workspace }}/app
          QA_OUT: ${{ github.workspace }}/qa-out
          QA_INPUTS: ${{ runner.temp }}/qa-inputs
          QA_PRIVATE: ${{ runner.temp }}/qa-private
          QA_PY: ${{ runner.temp }}/qa-venv/bin/python
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr60/playwright.config.ts
      - name: Collect sanitized service state
        if: always()
        working-directory: app
        run: |
          docker compose ps --all --format '{{.Service}} {{.State}} {{.Status}}' > ../qa-out/final-compose-ps.txt || true
          # Counts only: no payloads, transcript text, credentials or storage keys.
          docker compose exec -T postgres psql -U editagent -d editagent -AtX -c \
            "SELECT analyzer||' gen'||generation||' '||j.status||' applied='||applied FROM analysis_tasks t JOIN jobs j ON j.id=t.job_id ORDER BY t.media_asset_id,analyzer,generation" \
            > ../qa-out/final-analysis-tasks.txt 2>&1 || true
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-pr60-compose-${{ github.run_id }}
          path: qa-out
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable stack
        if: always()
        working-directory: app
        run: docker compose down -v --remove-orphans || true

  graduation-rerun:
    name: QA-F2 existing graduation test rerun + independent output validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: editagent
          POSTGRES_PASSWORD: editagent-dev-password
          POSTGRES_DB: editagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editagent -d editagent" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out application at the immutable PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          persist-credentials: false
      - name: Check out QA harness (separate directory)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr60
          persist-credentials: false
      - name: Verify exact application identity
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          test "$(git -C app rev-parse 'HEAD^{tree}')" = "$QA_APP_TREE"
          test -z "$(git -C app status --porcelain)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          mkdir -p qa-grad
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install and build (pinned, as repository CI)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --quiet numpy==2.3.3
      - name: Start SeaweedFS (repository script)
        working-directory: app
        run: sh infra/seaweedfs/start-storage.sh --from-boot
      - name: Existing ASR container build and US-210 orchestration test (unchanged; same order as repository CI)
        working-directory: app
        run: pnpm asr:container
      - name: Existing graduation integration test (unchanged)
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          PR_HEAD_SHA: ${{ env.QA_APP_SHA }}
        run: pnpm render:test --graduation-demo
      - name: Independent validation of the generated export
        if: always()
        run: |
          set -eu
          "$RUNNER_TEMP/qa-venv/bin/python" qa-src/qa/pr60/verify_media.py \
            --source app/.local/graduation-demo/demo-input.mp4 \
            --export app/.local/graduation-demo/private/export.mp4 \
            --keep 0.2:7.8 --duration 8 --out qa-grad/graduation-export-verification.json
          cp app/.local/graduation-demo-public/report.json qa-grad/ 2>/dev/null || true
          cp app/.local/graduation-demo-public/*.png qa-grad/ 2>/dev/null || true
          sha256sum app/.local/graduation-demo/private/export.mp4 app/.local/graduation-demo/demo-input.mp4 | sed 's#app/.local/graduation-demo/##' > qa-grad/sha256.txt
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-pr60-graduation-${{ github.run_id }}
          path: qa-grad
          if-no-files-found: warn
          retention-days: 14
