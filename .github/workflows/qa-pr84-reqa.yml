# Independent Re-QA for PR #84 repair (F1/F2 + Issue #86 exception; Issue #85). QA-only branch; never merged.
# The product under test is the frozen repair head, checked out separately; the original c049cbc is built only
# for the old-vs-fixed differential.
name: QA PR84 independent Re-QA

on:
  push:
    branches: [qa/pr84-reqa-5562e74]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-pr84-reqa
  cancel-in-progress: false

env:
  QA_APP_SHA: 5562e74c37134085b9810f47ce0be25959b0fc31
  QA_APP_TREE: 13f29c22641d6eb15856683b80f8a099c1d26b1c
  QA_OLD_SHA: c049cbcd6c4ce8730bd64a1ba1d9016957f3fc59
  QA_BASE_SHA: 4833dfaaa5ff8bac1660016d146ec5b3c18566e4
  GH_TOKEN: ${{ github.token }}

jobs:
  reqa:
    name: F1/F2 + Issue 86 exception + PG/library/image/tokenizer + lifecycle security regression (product 5562e74)
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      COMPOSE_PROJECT_NAME: qapr84r
      EDITAGENT_RUNTIME: development
      AUTH_COOKIE_SECURE: "false"
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      QA_APP_ROOT: ${{ github.workspace }}/app
      QA_OLD_ROOT: ${{ github.workspace }}/app-old
      QA_OUT: ${{ github.workspace }}/qa-out
      QA_INPUTS: ${{ github.workspace }}/qa-tmp/inputs
      QA_PRIVATE: ${{ github.workspace }}/qa-tmp/private
    steps:
      - name: "Gate 0 (before): PR #84 frozen at the repair head, OPEN/Draft, base unchanged"
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/pulls/84" | python3 -c "import json,sys,os;p=json.load(sys.stdin);print(p['state'],p['draft'],p['head']['sha'],p['base']['sha'],p['changed_files']);assert p['state']=='open' and p['draft'] is True and p['head']['sha']==os.environ['QA_APP_SHA'] and p['base']['sha']==os.environ['QA_BASE_SHA'] and p['changed_files']==25, 'HEAD_DRIFT'"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$QA_BASE_SHA" || { echo HEAD_DRIFT main; exit 1; }
      - name: Separate immutable product checkout (full history for the secret scan)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - name: Original product checkout (differential only)
        uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_OLD_SHA }}
          path: app-old
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr84r
          persist-credentials: false
      - name: Verify exact identities
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          test "$(git -C app rev-parse 'HEAD^{tree}')" = "$QA_APP_TREE"
          test -z "$(git -C app status --porcelain)"
          test "$(git -C app-old rev-parse HEAD)" = "$QA_OLD_SHA"
          mkdir -p qa-out
          printf '{"productSha":"%s","productTree":"%s","oldSha":"%s","qaHarnessSha":"%s","runId":"%s","runAttempt":"%s","runner":"%s/%s","startedAt":"%s"}\n' "$(git -C app rev-parse HEAD)" "$(git -C app rev-parse 'HEAD^{tree}')" "$(git -C app-old rev-parse HEAD)" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ImageOS" "$ImageVersion" "$(date -u +%FT%TZ)" > qa-out/identity.json
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          { echo "nproc=$(nproc)"; free -b | sed -n 2p; uname -sr; docker version --format 'docker {{.Server.Version}}'; lsb_release -ds; } | tee qa-out/runner.txt
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install and build the product API closure (incl. prompt bundle), FFmpeg, Chrome; build original agent-core for the differential
        run: |
          set -eu
          (cd app && pnpm install --frozen-lockfile && pnpm --filter "@editagent/api..." build && sh tools/test/ensure-ffmpeg.sh && sh tools/test/ensure-chrome.sh)
          (cd app-old && pnpm install --frozen-lockfile && pnpm --filter "@editagent/agent-core..." build)
          git -C app status --porcelain --untracked-files=no | tee qa-out/app-status-after-build.txt
      - name: Stage QA harness outside tracked application files; syntax checks; inputs
        run: |
          set -eu
          mkdir -p app/apps/web/.qa-pr84r && cp qa-src/qa/pr84r/* app/apps/web/.qa-pr84r/
          for f in app/apps/web/.qa-pr84r/*.mjs; do node --check "$f"; done
          python3 -m py_compile app/apps/web/.qa-pr84r/tok84.py app/apps/web/.qa-pr84r/gl84.py
          bash qa-src/qa/pr84r/make_inputs.sh "$QA_INPUTS" app
      - name: Part G - Issue 86 exception (pinned Gitleaks, full history, positive controls)
        run: |
          set -eu
          (cd app && ./infra/scripts/install-supply-chain-tools.sh gitleaks)
          python3 app/apps/web/.qa-pr84r/gl84.py app "$QA_BASE_SHA"
      - name: Part DF - original vs fixed differential (F1/F2)
        if: ${{ !cancelled() }}
        run: node app/apps/web/.qa-pr84r/diff84.mjs
      - name: Build production images from the frozen product (repository Dockerfiles)
        if: ${{ !cancelled() }}
        working-directory: app
        run: |
          set -eu
          docker compose config --quiet
          docker compose build postgres redis api web media-worker agent-worker ai-worker render-executor render-worker
      - name: Start real Compose stack (PostgreSQL, Redis/BullMQ, SeaweedFS S3, API, workers incl. real ASR)
        if: ${{ !cancelled() }}
        working-directory: app
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 180 postgres redis
          sh infra/seaweedfs/start-storage.sh --from-boot
          node apps/web/.qa-pr84r/bucket.mjs
          docker compose up -d --no-build --wait --wait-timeout 600 api web media-worker agent-worker ai-worker render-executor render-worker
          docker compose ps --format '{{.Service}} {{.State}} {{.Health}}' | tee ../qa-out/compose-ps.txt
      - name: Part PG - context over real PostgreSQL + Tool SDK (incl. F1 re-test)
        if: ${{ !cancelled() }}
        working-directory: app/apps/web
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr84r/playwright.config.ts pg84.spec.ts
      - name: Part L - registry/context library probes (incl. F2 byte battery, 60-minute budget)
        if: ${{ !cancelled() }}
        working-directory: app/apps/web/.qa-pr84r
        run: timeout 1800 node lib84.mjs
      - name: Part IMG - deployed production images
        if: ${{ !cancelled() }}
        working-directory: app/apps/web/.qa-pr84r
        run: timeout 900 node img84.mjs
      - name: Part T - independent tokenizer cross-check (proxies)
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/tok" && "$RUNNER_TEMP/tok/bin/pip" install --quiet tiktoken==0.8.0
          "$RUNNER_TEMP/tok/bin/python" app/apps/web/.qa-pr84r/tok84.py
          rm -rf qa-out/tok-samples
      - name: Regression - AgentRun lifecycle/auth/CSRF/SSE/audit security probes (QA-authored)
        if: ${{ !cancelled() }}
        working-directory: app/apps/web
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr84r/playwright.config.ts s77.spec.ts
      - name: Regression - real-PG driver crash/fence/replay probes
        if: ${{ !cancelled() }}
        working-directory: app/apps/web/.qa-pr84r
        run: |
          docker compose -f "$QA_APP_ROOT/compose.yaml" stop -t 5 agent-worker
          node d77.mjs
      - name: Collect sanitized state
        if: always()
        working-directory: app
        run: |
          docker compose ps --all --format '{{.Service}} {{.State}} {{.Status}}' > ../qa-out/final-compose-ps.txt || true
          docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT state||' '||coalesce(stop_reason,'-')||' '||count(*) FROM agent_runs GROUP BY state,stop_reason ORDER BY 1" > ../qa-out/final-agent-runs.txt 2>&1 || true
          docker compose logs --no-color api agent-worker 2>&1 | grep -cE "QA84FAKEKEY|QA84DUMMY|QA84hunter2|QA84pw|exfil\.example" > ../qa-out/log-secret-hits.txt || true
          date -u +%FT%TZ > ../qa-out/finishedAt.txt
      - name: "Gate 0 (after): PR head unchanged"
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/84" | python3 -c "import json,sys;p=json.load(sys.stdin);print(p['head']['sha'],'draft='+str(p['draft']).lower(),p['state'],p['base']['sha'])" | tee qa-out/identity-after.txt
          grep -q "^$QA_APP_SHA draft=true open $QA_BASE_SHA$" qa-out/identity-after.txt || { echo HEAD_DRIFT; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-pr84-reqa-${{ github.run_id }}
          path: qa-out
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable stack
        if: always()
        working-directory: app
        run: docker compose down -v --remove-orphans || true
      - name: "QA gate (fail-closed): PR #84 Re-QA probe inventory"
        if: always()
        run: node qa-src/qa/pr84r/gate84.mjs qa-out/qa84-results.json "PG01-12,P01-13,C01-09,IMG01-04,T01,G01-05,DF01-02" "P12,IMG04" "C08"
      - name: "QA gate (fail-closed): lifecycle security regression"
        if: always()
        run: node qa-src/qa/pr84r/gate84.mjs qa-out/qa77-results.json "S1-19,D1-18" "S10"

  graduation:
    name: Browser upload -> inspection -> analysis -> trim/split -> render -> playback -> download (product 5562e74)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: editagent
          POSTGRES_PASSWORD: editagent-dev-password
          POSTGRES_DB: editagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editagent -d editagent" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: "Gate 0 (before)"
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/84" --jq '.head.sha' | grep -qx "$QA_APP_SHA" || { echo HEAD_DRIFT; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr84r
          persist-credentials: false
      - name: Verify exact application identity
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          test "$(git -C app rev-parse 'HEAD^{tree}')" = "$QA_APP_TREE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          mkdir -p qa-grad
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install and build (pinned, as repository CI)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --quiet numpy==2.3.3
      - name: Start SeaweedFS (repository script)
        working-directory: app
        run: sh infra/seaweedfs/start-storage.sh --from-boot
      - name: Existing ASR container build (unchanged)
        working-directory: app
        run: pnpm asr:container
      - name: Existing graduation integration test (unchanged)
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          PR_HEAD_SHA: ${{ env.QA_APP_SHA }}
        run: pnpm render:test --graduation-demo
      - name: Independent validation of the generated export (FFprobe/frames/audio)
        if: always()
        run: |
          set -eu
          "$RUNNER_TEMP/qa-venv/bin/python" qa-src/qa/pr84r/verify_media.py \
            --source app/.local/graduation-demo/demo-input.mp4 \
            --export app/.local/graduation-demo/private/export.mp4 \
            --keep 0.2:7.8 --duration 8 --out qa-grad/graduation-export-verification.json
          cp app/.local/graduation-demo-public/report.json qa-grad/ 2>/dev/null || true
          sha256sum app/.local/graduation-demo/private/export.mp4 | sed 's#app/.local/graduation-demo/##' > qa-grad/sha256.txt
      - name: "Gate 0 (after)"
        if: always()
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/84" --jq '.head.sha + " draft=" + (.draft|tostring)' | tee qa-grad/identity-after.txt
          grep -qx "$QA_APP_SHA draft=true" qa-grad/identity-after.txt || { echo HEAD_DRIFT; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-pr84-reqa-graduation-${{ github.run_id }}
          path: qa-grad
          if-no-files-found: warn
          retention-days: 14
      - name: "QA gate (fail-closed): export verification"
        if: always()
        run: python3 -c "import json;d=json.load(open('qa-grad/graduation-export-verification.json'));assert d['pass'] is True;print('export verification PASS')"
