name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  storage-admission:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
    name: qualified storage admission
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      producer: ${{ steps.admit.outputs.producer }}
      producer_attempt: ${{ steps.admit.outputs.producer_attempt }}
      artifact: ${{ steps.admit.outputs.artifact }}
      receipt_sha256: ${{ steps.admit.outputs.receipt_sha256 }}
      promoted_id: ${{ steps.promote.outputs.artifact-id }}
      promoted_digest: ${{ steps.promote.outputs.artifact-digest }}
      promoted_bytes: ${{ steps.promote.outputs.artifact-bytes }}
      outcome: ${{ steps.admit.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Admit completed exact-head Supply workflow
        id: admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tools/test/load-qualified-storage.mjs admit
      - name: Preserve bounded admission outcome
        if: failure() && (steps.admit.outputs.outcome == 'PRODUCER_NOT_YET_COMPLETE' || steps.admit.outputs.outcome == 'PRODUCER_NOT_YET_CREATED') && github.run_attempt == 1
        uses: ./.github/actions/pc100-bounded-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        with:
          operation: upload
          role: outcome
          bundle: .local/issue99/outcome-bundle
      - name: Preserve verified preparation receipt
        id: promote
        uses: ./.github/actions/pc100-bounded-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        with:
          operation: upload
          role: ci
          bundle: ${{ steps.admit.outputs.ci_bundle }}

  repository:
    name: repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://editagent:editagent-dev-password@localhost:5432/editagent
      REDIS_URL: redis://127.0.0.1:6379/0
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: editagent
      S3_ACCESS_KEY_ID: editagent
      S3_SECRET_ACCESS_KEY: editagent-dev-secret
      S3_REGION: us-east-1
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: editagent
          POSTGRES_PASSWORD: editagent-dev-password
          POSTGRES_DB: editagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U editagent -d editagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 2

      - name: Setup admission Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true
          enable-cache: true
          ignore-nothing-to-cache: true
          python-version: "3.11"
          version: "0.12.20"

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Enable optional Turborepo remote cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ -n "${TURBO_TOKEN}" ] && [ -n "${TURBO_TEAM}" ]; then
            echo "::add-mask::${TURBO_TOKEN}"
            {
              echo "TURBO_TOKEN<<EOF"
              echo "${TURBO_TOKEN}"
              echo "EOF"
              echo "TURBO_TEAM<<EOF"
              echo "${TURBO_TEAM}"
              echo "EOF"
            } >> "${GITHUB_ENV}"
            echo "Turborepo remote cache enabled from repository secrets."
          else
            echo "Turborepo remote cache secrets are unset. CI uses the GitHub Actions cache of .turbo."
          fi

      - name: Check toolchain pins
        run: |
          set -eu
          expected_node="v$(tr -d '[:space:]' < .nvmrc)"
          actual_node="$(node --version)"
          expected_pnpm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual_pnpm="$(pnpm --version)"
          echo "node ${actual_node}"
          echo "pnpm ${actual_pnpm}"
          echo "python $(python3 --version)"
          echo "uv $(uv --version)"
          test "${actual_node}" = "${expected_node}"
          test "${actual_pnpm}" = "${expected_pnpm}"
          python3 -c 'import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 11) else 1)'

      - name: Install roadmap validator dependency
        run: python3 -m pip install pyyaml==6.0.1

      - name: Validate roadmap
        run: python3 tools/roadmap/build_roadmap.py --check

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate evaluation metadata (offline; gold completion reported separately)
        run: pnpm evaluation:validate

      - name: Independently verify silence interval accounting
        run: python3 -m unittest discover -s tools/audio -p 'test_*.py'

      - name: Start explicit MinIO application regression fixture
        run: |
          node tools/test/pc100-minio-regression.mjs repository
          S3_HOST=127.0.0.1 S3_PORT=9000 python3 infra/scripts/ensure_bucket.py
      - name: MinIO S3 API compatibility (not SeaweedFS qualification)
        run: node tests/architecture/seaweedfs-s3-contract.mjs --storage-backend=minio

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Install FFmpeg and Chrome
        run: |
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          ffprobe -version
          command -v google-chrome
          google-chrome --version

      - name: Verify Git LFS fixture checkout
        run: |
          git lfs version
          git lfs ls-files
          pnpm test:fixtures

      # Keep all Node, contract, domain, Python-unit, service and browser tests.
      # All complete real-ASR files run in the required matrix below.
      - name: Test (real inference runs in required matrix)
        env:
          PYTEST_ADDOPTS: >-
            --ignore=tests/test_real_asr.py
            --ignore=tests/test_real_multilingual_asr.py
            --ignore=tests/test_real_model_reuse.py
        run: pnpm test

      - name: Audit bounded agent lifecycle diagnostic
        id: agent-lifecycle-audit
        if: ${{ !cancelled() }}
        run: |
          if [ -d .local/agent-loop-lifecycle-public ]; then
            python3 tools/test/audit-artifacts.py .local/agent-loop-lifecycle-public
          fi

      - name: Upload bounded agent lifecycle diagnostic
        if: ${{ !cancelled() && steps.agent-lifecycle-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-loop-lifecycle-${{ github.sha }}
          if-no-files-found: ignore
          path: .local/agent-loop-lifecycle-public/diagnostic.json

      - name: Real non-root CPU ASR, S3 readiness and crash recovery
        if: ${{ !cancelled() }}
        run: pnpm asr:container

      - name: Real production render, cancellation and timeline golden frames
        if: ${{ !cancelled() }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm render:test --graduation-demo

      - name: Audit graduation demonstration evidence
        id: graduation-audit
        if: ${{ !cancelled() }}
        run: |
          if [ -d .local/graduation-demo-public ]; then
            python3 tools/test/audit-artifacts.py .local/graduation-demo-public
          fi
          if [ -d .local/agent-loop-public ]; then
            python3 tools/test/audit-artifacts.py .local/agent-loop-public
          fi
          if [ -d .local/caption-public ]; then
            python3 tools/test/audit-artifacts.py .local/caption-public
          fi

      - name: Upload allowlisted test summary
        if: ${{ !cancelled() && steps.graduation-audit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-summary-${{ github.sha }}
          if-no-files-found: ignore
          # Exact allowlist: counts and the newly generated graduation demo.
          # Native diagnostics, private logs, gold and existing render evidence
          # remain excluded. Screenshots mask account identity and transcript.
          path: |
            .local/asr-public/test-summary.json
            .local/render-batch/resource-observations.json
            .local/graduation-demo-public/report.json
            .local/graduation-demo-public/upload-inspection.png
            .local/graduation-demo-public/analysis-status.png
            .local/graduation-demo-public/timeline.png
            .local/graduation-demo-public/export.png
            .local/graduation-demo-public/demo-export.mp4
            .local/agent-loop-public/report.json
            .local/agent-loop-public/timeline.png
            .local/agent-loop-public/playback.png
            .local/agent-loop-public/agent-export.mp4
            .local/caption-public/report.json
            .local/caption-public/boundary-proof.json
            .local/caption-public/saved-captions.png
            .local/caption-public/caption-playback.png
            .local/caption-public/caption-export.mp4
            .local/caption-public/repair-report.json
            .local/caption-public/repair-saved.png
            .local/caption-public/repair-playback.png
            .local/caption-public/repair-export.mp4
            .local/caption-public/repair-boundary-export.mp4
            .local/caption-public/boundary-*.png
            .local/caption-public/visual/visual-report.json
            .local/caption-public/visual/*.png

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          if-no-files-found: ignore
          path: |
            coverage/lcov.info
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
            workers/*/coverage/lcov.info
            workers/ai-worker/coverage.xml
      - name: Remove explicit MinIO regression fixture
        if: always()
        run: |
          if [ -f .local/pc100-minio-regression/repository.json ]; then
            node tools/test/pc100-minio-regression.mjs stop-repository
          fi

  real-asr:
    name: real ASR (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - native
          - languages
          - state-single
          - state-multi
          - long-input
          - alignment
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          # Offline base/head inference A/B reads the pinned published source from Git.
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true
          enable-cache: true
      - name: Install pinned audio runtime
        run: sh tools/test/ensure-ffmpeg.sh
      - name: Prepare immutable offline models
        working-directory: workers/ai-worker
        run: |
          uv sync --frozen
          uv run python -m editagent_ai_worker.infrastructure.vad_model
          uv run python -m editagent_ai_worker.infrastructure.asr_model --root ../../.local/asr-models --model tiny
          uv run python -m editagent_ai_worker.infrastructure.asr_model --root ../../.local/asr-models --model small
      - name: Check complete real-inference partition
        working-directory: workers/ai-worker
        run: uv run python ../../tools/asr/test_partition.py --check
      - name: Run every assigned real-inference test
        working-directory: workers/ai-worker
        run: uv run python ../../tools/asr/test_partition.py --shard "${{ matrix.shard }}"
      - name: Setup pinned Node for production qualification
        if: ${{ !cancelled() && matrix.shard == 'long-input' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Original ten-minute inference in the production CPU jail
        if: ${{ !cancelled() && matrix.shard == 'long-input' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Sequential runs retain this job's existing 45m cap and the 600000ms inference limit.
          node tools/asr/container.mjs --build-only --model tiny
          node tools/asr/qualification.mjs
      - name: Upload allowlisted test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: asr-test-summary-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            .local/asr-public/test-summary.json

  seaweedfs-product:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
    name: candidate SeaweedFS production journey
    needs: storage-admission
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          version: "0.12.20"
      - name: Independently load qualified candidate
        id: storage-load
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tools/test/load-qualified-storage.mjs load '${{ needs.storage-admission.outputs.producer }}:${{ needs.storage-admission.outputs.producer_attempt }}:${{ needs.storage-admission.outputs.artifact }}'
      - name: Bind actual candidate evidence
        run: echo 'SEAWEED_QUALIFIED_RECEIPT=${{ steps.storage-load.outputs.receipt }}' >> "$GITHUB_ENV"
      - name: Install and build workspace
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          pnpm test:fixtures
      - name: Start SeaweedFS and require firewall JWT and trust-boundary controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ./infra/seaweedfs/start-storage.sh --from-boot
          curl -fsS http://127.0.0.1:9000/status >/dev/null
          S3_HOST=127.0.0.1 S3_PORT=9000 python3 infra/scripts/ensure_bucket.py
          ./infra/seaweedfs/verify-firewall-lifecycle.sh
          ./infra/seaweedfs/verify-jwt-authority.sh
          ./infra/seaweedfs/verify-trust-boundary.sh
      - name: Check SeaweedFS S3 contract including stopped backup and restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tests/architecture/seaweedfs-s3-contract.mjs --verify-backup
      - name: Stop disposable contract stack before independent recovery journey
        run: docker compose down --remove-orphans
      - name: Real storage migration and isolated recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tests/integration/seaweedfs-security-recovery.mjs
      - name: Build immutable production ASR image
        run: node tools/asr/container.mjs --build-only --model tiny
      - name: Independent candidate SeaweedFS browser to export
        env:
          PC100_METADATA_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm render:test --graduation-demo --storage-seaweedfs
      - name: Verify final exact-head admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tools/test/load-qualified-storage.mjs final '${{ steps.storage-load.outputs.receipt }}'
      - name: Audit bounded real-service evidence
        id: audit
        if: ${{ !cancelled() }}
        run: |
          for folder in .local/seaweedfs-recovery-public .local/graduation-demo-public .local/caption-public .local/agent-loop-public; do
            if [ -d "$folder" ]; then python3 tools/test/audit-artifacts.py "$folder"; fi
          done
      - name: Preserve actual candidate media and recovery proof
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: seaweedfs-product-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          path: |
            .local/seaweedfs-recovery-public/report.json
            .local/graduation-demo-public/report.json
            .local/graduation-demo-public/upload-inspection.png
            .local/graduation-demo-public/analysis-status.png
            .local/graduation-demo-public/timeline.png
            .local/graduation-demo-public/export.png
            .local/graduation-demo-public/demo-export.mp4
            .local/caption-public/report.json
            .local/caption-public/repair-report.json
            .local/caption-public/repair-saved.png
            .local/caption-public/repair-playback.png
            .local/caption-public/repair-export.mp4
            .local/caption-public/repair-boundary-export.mp4
            .local/caption-public/repair-boundary-proof.json

  render-isolated:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
    name: isolated real MinIO render diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build the existing render dependency graph
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @editagent/render-worker... build
          sh tools/test/ensure-ffmpeg.sh
      - name: Real isolated rendering with unchanged CPU memory and deadline limits
        run: pnpm render:test

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [storage-admission, repository, real-asr, seaweedfs-product, render-isolated]
    if: ${{ always() }}
    steps:
      - name: Require repository checks and every real-inference shard
        env:
          CANDIDATE_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 100 }}
          ADMISSION_RESULT: ${{ needs.storage-admission.result }}
          SEAWEEDFS_RESULT: ${{ needs.seaweedfs-product.result }}
          ISOLATED_RENDER_RESULT: ${{ needs.render-isolated.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          REAL_ASR_RESULT: ${{ needs['real-asr'].result }}
        run: |
          if [ "$CANDIDATE_EVENT" = true ]; then
            test "$ADMISSION_RESULT" = success
            test "$SEAWEEDFS_RESULT" = success
            test "$ISOLATED_RENDER_RESULT" = success
          fi
          test "$REPOSITORY_RESULT" = success
          test "$REAL_ASR_RESULT" = success
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Retrieve exact preparation receipt
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
        id: receipt-download
        uses: ./.github/actions/pc100-bounded-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        with:
          operation: download
          role: ci
          artifact-id: ${{ needs.storage-admission.outputs.promoted_id }}
          artifact-digest: ${{ needs.storage-admission.outputs.promoted_digest }}
          artifact-bytes: ${{ needs.storage-admission.outputs.promoted_bytes }}
      - name: Validate raw preparation receipt ZIP
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
        id: receipt-zip
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
          PC100_RAW_ZIP_DIGEST: ${{ steps.receipt-download.outputs.artifact-digest }}
          PC100_RAW_ZIP_BYTES: ${{ steps.receipt-download.outputs.artifact-bytes }}
          PC100_RAW_ZIP: ${{ steps.receipt-download.outputs.download-path }}
          PC100_RECEIPT_SHA: ${{ needs.storage-admission.outputs.receipt_sha256 }}
        run: node tools/test/load-qualified-storage.mjs receipt-zip "$(dirname "$PC100_RAW_ZIP")" "$PC100_RECEIPT_SHA"
      - name: Verify genuine final identity and producer
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 100
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PC100_METADATA_TOKEN: ${{ github.token }}
        run: node tools/test/load-qualified-storage.mjs final '${{ steps.receipt-zip.outputs.receipt }}' '${{ needs.storage-admission.outputs.receipt_sha256 }}'
