name: PC100 trusted source verifier
on:
  workflow_run:
    workflows: [PC100 artifact integration]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/pc100-artifact-integration.yml' &&
      github.event.workflow_run.repository.id == 1395822921 &&
      github.event.workflow_run.head_repository.id == 1395822921 &&
      github.event.workflow_run.pull_requests[0].number == 100 &&
      github.event.workflow_run.pull_requests[1] == null &&
      github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
      github.event.workflow_run.pull_requests[0].head.ref == github.event.workflow_run.head_branch
    name: PC100 trusted source verification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout only the protected default-branch workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Verify source without executing any PR code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_WORKFLOW_SHA"
          node tools/test/pc100-source-verifier.mjs
