name: PC100 artifact integration
on:
  pull_request:
    branches: [main]
    paths:
      - tools/test/load-qualified-storage.mjs
      - tools/test/pc100-artifact-integration.mjs
      - tests/architecture/seaweedfs-security-build.test.mjs
      - tests/architecture/pc100-source-verifier.test.mjs
      - tools/test/pc100-source-verifier.mjs
      - .github/workflows/pc100-artifact-integration.yml
      - .github/workflows/pc100-source-verifier.yml
permissions:
  contents: read
jobs:
  transport:
    name: PC100 real REST transport
    if: github.event.pull_request.number == 100 && github.event.pull_request.head.repo.id == 1395822921
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Test all portable contracts and actual Linux resource controls
        run: |
          set -euo pipefail
          uname -a
          cat /etc/os-release
          node -v
          python3 --version
          /usr/bin/time -v node --test --test-reporter=tap tests/architecture/seaweedfs-security-build.test.mjs tests/architecture/seaweedfs-object-storage.test.mjs tests/architecture/pc100-source-verifier.test.mjs
      - name: Prepare bounded disposable fixture
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          await mkdir('.local/pc100-rest-fixture',{recursive:false});
          const payload=Buffer.alloc(65536,42);
          await writeFile('.local/pc100-rest-fixture/payload.bin',payload);
          await writeFile('.local/pc100-rest-fixture/manifest.json',JSON.stringify({schema:'pc100-fixture-v1',H:process.env.TARGET_SHA,bytes:payload.length,sha256:createHash('sha256').update(payload).digest('hex')}));
          JS
      - name: Upload disposable fixture
        id: upload
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pc100-rest-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/pc100-rest-fixture/*
          if-no-files-found: error
          compression-level: 0
          archive: true
          retention-days: 1
      - name: Verify genuine shell REST download and negative controls
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          FIXTURE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          FIXTURE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: env -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL node tools/test/pc100-artifact-integration.mjs verify
  denied:
    name: PC100 REST credential boundaries
    needs: transport
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Observe public read policy and require real invalid-credential rejection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          FIXTURE_ARTIFACT_ID: ${{ needs.transport.outputs.artifact }}
          FIXTURE_ARTIFACT_DIGEST: ${{ needs.transport.outputs.digest }}
        run: env -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RESULTS_URL node tools/test/pc100-artifact-integration.mjs deny
