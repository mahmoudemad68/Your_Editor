# Independent QA for PR #77 (US-303/US-306; Issue #78). QA-only branch; never merged.
# The application under test is the immutable PR head, checked out separately from this harness.
name: QA PR77 independent

on:
  push:
    branches: [qa/pr77-faedd0b]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-pr77-independent
  cancel-in-progress: false

env:
  QA_APP_SHA: faedd0bff70f4bb1ad7671a689523eef8a6381fa
  QA_BASE_SHA: 00074f22f1325307bfc6c6a24a270ee10601bc9b
  GH_TOKEN: ${{ github.token }}

jobs:
  blackbox:
    name: Real-service AgentRun lifecycle, SSE, audit/export + real-PG driver crash/fence/replay
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COMPOSE_PROJECT_NAME: qapr77
      EDITAGENT_RUNTIME: development
      AUTH_COOKIE_SECURE: "false"
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      QA_APP_ROOT: ${{ github.workspace }}/app
      QA_OUT: ${{ github.workspace }}/qa-out
      QA_INPUTS: ${{ github.workspace }}/qa-tmp/inputs
      QA_PRIVATE: ${{ github.workspace }}/qa-tmp/private
    steps:
      - name: "Gate 0: PR #77 is still the frozen Draft head"
        run: |
          set -eu
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/77")"
          echo "$pr" | python3 -c "import json,sys,os;p=json.load(sys.stdin);print(p['state'],p['draft'],p['head']['sha'],p['base']['sha'],p['changed_files']);assert p['state']=='open' and p['draft'] is True and p['head']['sha']==os.environ['QA_APP_SHA'] and p['changed_files']==46"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr77
          persist-credentials: false
      - name: Verify exact application identity
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          test -z "$(git -C app status --porcelain)"
          mkdir -p qa-out
          printf '{"appSha":"%s","appTree":"%s","qaHarnessSha":"%s","runId":"%s","runner":"%s"}\n' "$(git -C app rev-parse HEAD)" "$(git -C app rev-parse 'HEAD^{tree}')" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RUNNER_OS/$ImageOS/$ImageVersion" > qa-out/identity.json
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          { echo "nproc=$(nproc)"; free -b | sed -n 2p; uname -sr; docker version --format 'docker {{.Server.Version}}'; docker compose version; lsb_release -ds; } | tee qa-out/runner.txt
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install pinned dependencies, build the API closure, FFmpeg and Chrome
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@editagent/api..." build
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          git status --porcelain --untracked-files=no | tee ../qa-out/app-status-after-build.txt
      - name: Stage QA harness outside tracked application files; syntax check
        run: |
          set -eu
          mkdir -p app/apps/web/.qa-pr77 && cp qa-src/qa/pr77/* app/apps/web/.qa-pr77/
          for f in app/apps/web/.qa-pr77/*.mjs; do node --check "$f"; done
          bash -n app/apps/web/.qa-pr77/make_inputs.sh
          bash qa-src/qa/pr77/make_inputs.sh "$QA_INPUTS" app
      - name: Build production images (repository Dockerfiles)
        working-directory: app
        run: |
          set -eu
          docker compose config --quiet
          docker compose build postgres redis api web media-worker agent-worker render-executor render-worker
          for img in editagent-agent-worker:local editagent-api:local; do
            echo "== $img first-party test/fixture files (outside node_modules):"
            timeout 300 docker run --rm --entrypoint sh "$img" -c 'w=$(pwd); echo "workdir=$w"; find "$w" -name node_modules -prune -o \( -name "*.test.js" -o -name "*agent-run-child*" -o -name "*.test.ts" \) -print 2>/dev/null; echo "third-party node_modules *.test.js: $(find "$w" -path "*/node_modules/*" -name "*.test.js" -print 2>/dev/null | wc -l)"; echo "scripted driver references in first-party code: $(grep -rl --exclude-dir=node_modules -e AGENT_TEST_MODE -e agent-run-child "$w" 2>/dev/null | wc -l)"' || echo "scan timed out"
          done | tee ../qa-out/image-test-files.txt
      - name: Start real Compose stack
        working-directory: app
        run: |
          set -eu
          docker compose up -d --wait --wait-timeout 180 postgres redis
          sh infra/seaweedfs/start-storage.sh --from-boot
          node apps/web/.qa-pr77/bucket.mjs
          docker compose up -d --no-build --wait --wait-timeout 420 api web media-worker agent-worker render-executor render-worker
          docker compose ps --format '{{.Service}} {{.State}} {{.Health}}' | tee ../qa-out/compose-ps.txt
          docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT id FROM schema_migrations ORDER BY id DESC LIMIT 2" | tee ../qa-out/migrations.txt
      - name: Part S - production containers (HTTP, SSE, audit/export, outages, competing workers)
        working-directory: app/apps/web
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr77/playwright.config.ts s77.spec.ts
      - name: Part D - QA driver over real PostgreSQL + ToolExecutor (crash, cancel, fences, replay)
        if: ${{ !cancelled() }}
        working-directory: app/apps/web/.qa-pr77
        run: |
          docker compose -f "$QA_APP_ROOT/compose.yaml" stop -t 5 agent-worker
          node d77.mjs
      - name: Collect sanitized state
        if: always()
        working-directory: app
        run: |
          docker compose ps --all --format '{{.Service}} {{.State}} {{.Status}}' > ../qa-out/final-compose-ps.txt || true
          docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT state||' '||coalesce(stop_reason,'-')||' '||count(*) FROM agent_runs GROUP BY state,stop_reason ORDER BY 1" > ../qa-out/final-agent-runs.txt 2>&1 || true
          docker compose logs --no-color agent-worker api 2>&1 | grep -iE "agent|error" | grep -viE "password|secret|token|cookie" | tail -200 > ../qa-out/agent-log-tail.txt || true
      - name: "Gate 0 (after): PR head unchanged"
        if: always()
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/77" --jq '.head.sha + " draft=" + (.draft|tostring)' | tee -a qa-out/identity-after.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-pr77-blackbox-${{ github.run_id }}
          path: qa-out
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable stack
        if: always()
        working-directory: app
        run: docker compose down -v --remove-orphans || true

  upgrade:
    name: Populated main -> PR head (atomic failed 0022, successful 0022, code rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      COMPOSE_PROJECT_NAME: qapr77up
      EDITAGENT_RUNTIME: development
      AUTH_COOKIE_SECURE: "false"
      AUTH_TRUSTED_ORIGINS: http://localhost:3000
      QA_APP_ROOT: ${{ github.workspace }}/app
      QA_OUT: ${{ github.workspace }}/qa-up
      QA_INPUTS: ${{ github.workspace }}/qa-tmp/inputs
      QA_PRIVATE: ${{ github.workspace }}/qa-tmp/private
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_BASE_SHA }}
          path: app
          lfs: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr77
          persist-credentials: false
      - name: Verify base identity and ancestry
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          test "$(git -C app rev-parse HEAD)" = "$QA_BASE_SHA"
          test "$(git -C app merge-base "$QA_BASE_SHA" "$QA_APP_SHA")" = "$QA_BASE_SHA"
          mkdir -p qa-up
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Base install, harness, inputs
        run: |
          set -eu
          (cd app && pnpm install --frozen-lockfile && sh tools/test/ensure-ffmpeg.sh && sh tools/test/ensure-chrome.sh)
          mkdir -p app/apps/web/.qa-pr77 && cp qa-src/qa/pr77/* app/apps/web/.qa-pr77/
          bash qa-src/qa/pr77/make_inputs.sh "$QA_INPUTS" app
      - name: Build and start the BASE stack
        working-directory: app
        run: |
          set -eu
          docker compose build postgres redis api web media-worker agent-worker render-executor render-worker
          docker tag editagent-api:local qa77-base-api:local
          docker compose up -d --wait --wait-timeout 180 postgres redis
          sh infra/seaweedfs/start-storage.sh --from-boot
          node apps/web/.qa-pr77/bucket.mjs
          docker compose up -d --no-build --wait --wait-timeout 420 api web media-worker agent-worker render-executor render-worker
      - name: Upgrade part 1 - populate base
        working-directory: app/apps/web
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr77/playwright.config.ts u77-base.spec.ts
      - name: Switch code to the PR head and build
        run: |
          set -eu
          (cd app && docker compose stop api web media-worker agent-worker render-executor render-worker)
          git -C app checkout --detach "$QA_APP_SHA"
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          ! git -C app status --porcelain --untracked-files=all | grep -v '^?? apps/web/.qa-pr77/'
          (cd app && pnpm install --frozen-lockfile && docker compose build api web media-worker agent-worker render-executor render-worker)
      - name: "Rollback A - failed 0022 must be atomic (QA pre-creates a conflicting object)"
        working-directory: app
        run: |
          set -u
          psql() { docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "$1"; }
          psql "CREATE FUNCTION agent_append_only() RETURNS trigger LANGUAGE plpgsql AS \$\$ BEGIN RETURN NULL; END; \$\$;"
          docker compose up -d --no-build api || true
          healthy=false
          for i in $(seq 1 30); do sleep 3; if curl -fsS -m 3 http://localhost:3001/ready >/dev/null 2>&1; then healthy=true; break; fi; done
          has=$(psql "SELECT count(*) FROM schema_migrations WHERE id LIKE '0022%'")
          tables=$(psql "SELECT coalesce(to_regclass('agent_runs')::text,'null')||','||coalesce(to_regclass('agent_steps')::text,'null')||','||coalesce(to_regclass('agent_events')::text,'null')")
          tl=$(python3 -c 'import json,os;print(json.load(open(os.environ["QA_PRIVATE"]+"/upgrade77.json"))["timeline"])')
          sha=$(psql "SELECT state_sha256 FROM editing_timelines WHERE id='$tl'")
          docker compose logs --no-color api 2>&1 | tail -5 | sed -E 's/(password|secret)[^ ]*/[redacted]/gI' > ../qa-up/failed-migration-api-log.txt
          python3 - "$healthy" "$has" "$tables" "$sha" > "$QA_PRIVATE/failed-migration.json" <<'EOF'
          import json,sys
          h,has,t,sha=sys.argv[1:5]
          print(json.dumps({"apiHealthy":h=="true","has0022":has.strip()!="0","tables":[None if x=="null" else x for x in t.strip().split(",")],"timelineSha":sha.strip()}))
          EOF
          cp "$QA_PRIVATE/failed-migration.json" ../qa-up/
          docker compose stop api
          psql "DROP FUNCTION agent_append_only();"
      - name: Start the HEAD application on the same volumes
        working-directory: app
        run: |
          set -eu
          docker tag editagent-api:local qa77-head-api:local
          docker compose up -d --no-build --wait --wait-timeout 420 api web media-worker agent-worker render-executor render-worker
          docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT id FROM schema_migrations ORDER BY id DESC LIMIT 2" | tee ../qa-up/head-migrations.txt
      - name: Upgrade part 2 - verify migrated data and AgentRun on pre-existing timeline
        working-directory: app/apps/web
        run: node node_modules/@playwright/test/cli.js test --config .qa-pr77/playwright.config.ts u77-head.spec.ts
      - name: "Rollback B - previous API code against the migrated database"
        working-directory: app
        run: |
          set -u
          docker tag qa77-base-api:local editagent-api:local
          docker compose up -d --no-build --force-recreate api || true
          ok=false; for i in $(seq 1 40); do sleep 3; if curl -fsS -m 3 http://localhost:3001/ready >/dev/null 2>&1; then ok=true; break; fi; done
          rows=$(docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT count(*) FROM agent_runs")
          echo "{\"baseApiReadyOnMigratedDb\":$ok,\"agentRunsPreserved\":$rows}" | tee ../qa-up/rollback-code.json
          docker tag qa77-head-api:local editagent-api:local
          docker compose up -d --no-build --force-recreate --wait --wait-timeout 300 api
          after=$(docker compose exec -T postgres psql -U editagent -d editagent -AtX -c "SELECT count(*) FROM agent_runs")
          echo "{\"headRestoredRows\":$after}" | tee -a ../qa-up/rollback-code.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-pr77-upgrade-${{ github.run_id }}
          path: qa-up
          if-no-files-found: warn
          retention-days: 14
      - name: Remove disposable stack
        if: always()
        working-directory: app
        run: docker compose down -v --remove-orphans || true

  graduation:
    name: Browser upload -> inspection -> analysis -> trim/split -> render -> playback -> download (regression)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: editagent
          POSTGRES_PASSWORD: editagent-dev-password
          POSTGRES_DB: editagent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U editagent -d editagent" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.QA_APP_SHA }}
          path: app
          lfs: true
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: qa-src
          sparse-checkout: qa/pr77
          persist-credentials: false
      - name: Verify exact application identity
        run: |
          set -eu
          test "$(git -C app rev-parse HEAD)" = "$QA_APP_SHA"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          mkdir -p qa-grad
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install and build (pinned, as repository CI)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          sh tools/test/ensure-ffmpeg.sh
          sh tools/test/ensure-chrome.sh
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --quiet numpy==2.3.3
      - name: Start SeaweedFS (repository script)
        working-directory: app
        run: sh infra/seaweedfs/start-storage.sh --from-boot
      - name: Existing ASR container build (unchanged)
        working-directory: app
        run: pnpm asr:container
      - name: Existing graduation integration test (unchanged)
        if: ${{ !cancelled() }}
        working-directory: app
        env:
          PR_HEAD_SHA: ${{ env.QA_APP_SHA }}
        run: pnpm render:test --graduation-demo
      - name: Independent validation of the generated export (FFprobe/frames/audio)
        if: always()
        run: |
          set -eu
          "$RUNNER_TEMP/qa-venv/bin/python" qa-src/qa/pr77/verify_media.py \
            --source app/.local/graduation-demo/demo-input.mp4 \
            --export app/.local/graduation-demo/private/export.mp4 \
            --keep 0.2:7.8 --duration 8 --out qa-grad/graduation-export-verification.json
          cp app/.local/graduation-demo-public/report.json qa-grad/ 2>/dev/null || true
          sha256sum app/.local/graduation-demo/private/export.mp4 | sed 's#app/.local/graduation-demo/##' > qa-grad/sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-pr77-graduation-${{ github.run_id }}
          path: qa-grad
          if-no-files-found: warn
          retention-days: 14
