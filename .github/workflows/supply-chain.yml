name: Supply chain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true
          enable-cache: true
          ignore-nothing-to-cache: true
          python-version: "3.11"
          version: "0.12.20"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install secret scanner
        run: ./infra/scripts/install-supply-chain-tools.sh gitleaks

      - name: Prove synthetic secret rejection
        run: python3 infra/scripts/secret-canary.py

      - name: Scan for secrets
        id: secrets
        run: |
          set +e
          mkdir -p supply-chain-evidence
          gitleaks detect \
            --source . \
            --redact \
            --config .gitleaks.toml \
            --report-path supply-chain-evidence/gitleaks.json \
            --report-format json \
            --exit-code 1
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: Scan Node dependencies
        id: node
        run: |
          set +e
          mkdir -p supply-chain-evidence
          pnpm audit --json > supply-chain-evidence/node-audit.json
          python3 infra/scripts/node-audit-report.py supply-chain-evidence/node-audit.json
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: Scan development dependencies
        id: node_dev
        run: |
          set +e
          pnpm audit --dev --json > supply-chain-evidence/node-dev-audit.json
          python3 infra/scripts/node-audit-report.py supply-chain-evidence/node-dev-audit.json
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: Scan Python dependencies
        id: python
        env:
          SUPPLY_CHAIN_EVIDENCE: supply-chain-evidence
        run: |
          set +e
          ./infra/scripts/audit-python.sh
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: Record dependency scan pass
        run: |
          set -eu
          test "${{ steps.secrets.outputs.status }}" = "0"
          test "${{ steps.node.outputs.status }}" = "0"
          test "${{ steps.node_dev.outputs.status }}" = "0"
          test "${{ steps.python.outputs.status }}" = "0"
          printf 'pass\n' > dependencies

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-dependencies
          if-no-files-found: ignore
          path: supply-chain-evidence/

      - name: Upload dependency scan result
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-dependencies
          path: dependencies

  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: media-worker
            dockerfile: workers/media-worker/Dockerfile
          - service: render-worker
            dockerfile: workers/render-worker/Dockerfile
          - service: agent-worker
            dockerfile: workers/agent-worker/Dockerfile
          - service: ai-worker
            dockerfile: workers/ai-worker/Dockerfile
          - service: seaweedfs
            dockerfile: infra/seaweedfs/Dockerfile
          - service: postgres
            dockerfile: infra/postgres/Dockerfile
          - service: redis
            dockerfile: infra/redis/Dockerfile
          - service: test-minio
            dockerfile: tests/integration/support/Minio.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          set -eu
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -f "${{ matrix.dockerfile }}" \
            -t "editagent-${{ matrix.service }}:${GITHUB_SHA}" \
            .

      - name: Probe media containers
        if: matrix.service == 'media-worker'
        run: ./infra/scripts/verify-media-ffmpeg.sh "editagent-${{ matrix.service }}:${GITHUB_SHA}"

      - name: Install Syft and Trivy
        run: ./infra/scripts/install-supply-chain-tools.sh

      - name: Generate SBOM and scan
        run: ./infra/scripts/supply-chain-scan-image.sh "${{ matrix.service }}" "editagent-${{ matrix.service }}:${GITHUB_SHA}"

      - name: Preserve scanned production image for main publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.service != 'test-minio'
        run: docker save "editagent-${{ matrix.service }}:${GITHUB_SHA}" | gzip > scanned-image.tar.gz

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.service != 'test-minio'
        uses: actions/upload-artifact@v7
        with:
          name: scanned-image-${{ matrix.service }}
          path: scanned-image.tar.gz
          retention-days: 2

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-sbom-${{ matrix.service }}
          if-no-files-found: ignore
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-trivy-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            trivy-${{ matrix.service }}.json
            trivy-${{ matrix.service }}.version.txt

      - name: Upload scan result
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-${{ matrix.service }}
          path: ${{ matrix.service }}

  supply-chain-security:
    name: supply-chain-security
    needs: [dependencies, images]
    if: always() && needs.dependencies.result != 'cancelled' && needs.images.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download scan results
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-scan-*
          merge-multiple: true
          path: scan-results
        continue-on-error: true

      - name: Download vulnerability reports
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-trivy-*
          merge-multiple: true
          path: trivy-reports
        continue-on-error: true

      - name: Report high and critical findings
        run: python3 infra/scripts/supply-chain-findings.py trivy-reports

      - name: Require every scan to pass
        env:
          SCAN_DIR: scan-results
        run: ./infra/scripts/supply-chain-security-gate.sh

  publish:
    name: publish ${{ matrix.service }}
    needs: [dependencies, images, supply-chain-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          [
            api,
            web,
            media-worker,
            render-worker,
            agent-worker,
            ai-worker,
            seaweedfs,
            postgres,
            redis,
          ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: scanned-image-${{ matrix.service }}
      - uses: actions/download-artifact@v7
        with:
          name: supply-chain-sbom-${{ matrix.service }}
      - name: Load exact scanned bytes and log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          gzip -dc scanned-image.tar.gz | docker load
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable SHA tag and capture digest/SBOM binding
        run: ./infra/scripts/publish-release-image.sh '${{ matrix.service }}'
      - uses: actions/upload-artifact@v7
        with:
          name: release-image-${{ matrix.service }}
          path: release/
          retention-days: 90
      - name: Remove registry authentication
        if: always()
        run: docker logout ghcr.io

  release:
    name: release manifest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: release-image-*
          merge-multiple: true
          path: release/
      - name: Validate complete immutable image set
        run: python3 infra/scripts/release_manifest.py assemble --sha "$GITHUB_SHA" --directory release
      - name: Bundle accepted release infrastructure
        run: |
          mkdir -p bundle
          git archive "$GITHUB_SHA" compose.yaml compose.staging.yaml infra | tar -x -C bundle
          cp release/* bundle/
          tar -czf release-bundle.tar.gz -C bundle .
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          path: |
            release/
            release-bundle.tar.gz
          retention-days: 90

  staging:
    name: owner-approved staging
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    environment: staging
    concurrency:
      group: staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Require configured Owner review protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/staging" > environment.json
          python3 -c 'import json; e=json.load(open("environment.json")); assert any(r.get("type")=="required_reviewers" and r.get("reviewers") and r.get("prevent_self_review") for r in e.get("protection_rules",[])), "Owner Environment protection is required"'
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ github.sha }}
      - name: Deploy immutable image set and run bounded smoke
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PATH: ${{ secrets.STAGING_PATH }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          GHCR_PULL_TOKEN: ${{ github.token }}
          GHCR_PULL_USER: ${{ github.actor }}
        run: ./infra/scripts/staging-ssh.sh
