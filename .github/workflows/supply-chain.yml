name: Supply chain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: media-worker
            dockerfile: workers/media-worker/Dockerfile
          - service: render-worker
            dockerfile: workers/render-worker/Dockerfile
          - service: agent-worker
            dockerfile: workers/agent-worker/Dockerfile
          - service: ai-worker
            dockerfile: workers/ai-worker/Dockerfile
          - service: minio
            dockerfile: infra/minio/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Image names
        id: names
        run: |
          set -eu
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          local_image="editagent-${{ matrix.service }}:${GITHUB_SHA}"
          remote_image="ghcr.io/${owner}/editagent-${{ matrix.service }}:${GITHUB_SHA}"
          echo "local=${local_image}" >> "${GITHUB_OUTPUT}"
          echo "remote=${remote_image}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -eu
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ steps.names.outputs.local }}" \
            .

      - name: Install Syft and Trivy
        run: ./infra/scripts/install-supply-chain-tools.sh

      - name: Generate SBOM
        run: |
          set -eu
          syft "${{ steps.names.outputs.local }}" -o spdx-json="sbom-${{ matrix.service }}.spdx.json"
          test -s "sbom-${{ matrix.service }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Scan image for critical vulnerabilities
        run: trivy image --severity CRITICAL --exit-code 1 "${{ steps.names.outputs.local }}"

      - name: Publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          docker tag "${{ steps.names.outputs.local }}" "${{ steps.names.outputs.remote }}"
          docker push "${{ steps.names.outputs.remote }}"
          digest="$(docker buildx imagetools inspect "${{ steps.names.outputs.remote }}" --format '{{.Manifest.Digest}}')"
          name="${{ steps.names.outputs.remote }}"
          name="${name%:*}"
          printf '%s@%s\n' "$name" "$digest" > "digest-${{ matrix.service }}.txt"
          grep -q '@sha256:[a-f0-9]\{64\}$' "digest-${{ matrix.service }}.txt"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ matrix.service }}-digest
          path: digest-${{ matrix.service }}.txt

  platform-digests:
    name: platform image digests
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pinned Postgres and Redis digests
        run: |
          set -eu
          docker pull postgres:16.10-alpine
          docker pull redis:7.4-alpine
          postgres="$(docker image inspect postgres:16.10-alpine --format '{{index .RepoDigests 0}}')"
          redis="$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}')"
          printf 'EDITAGENT_POSTGRES_IMAGE=%s\n' "$postgres" > platform-digests.txt
          printf 'EDITAGENT_REDIS_IMAGE=%s\n' "$redis" >> platform-digests.txt
          grep -q '@sha256:' platform-digests.txt

      - name: Upload platform digests
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-platform
          path: platform-digests.txt

  deploy:
    name: deploy staging
    needs: [images, platform-digests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      MINIO_ROOT_USER: ${{ vars.MINIO_ROOT_USER }}
      S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_PUBLIC_ENDPOINT: ${{ vars.S3_PUBLIC_ENDPOINT }}
      STAGING_BIND_IP: ${{ vars.STAGING_BIND_IP }}
      STAGING_WEB_PORT: ${{ vars.STAGING_WEB_PORT }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
      MEDIA_INSPECT_QUEUE: ${{ vars.MEDIA_INSPECT_QUEUE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download published digests
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-*
          merge-multiple: true
          path: supply-chain

      - name: Require staging configuration
        run: |
          set -eu
          missing=""
          for name in \
            STAGING_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_SSH_KNOWN_HOSTS \
            POSTGRES_PASSWORD MINIO_ROOT_PASSWORD S3_SECRET_ACCESS_KEY \
            POSTGRES_USER POSTGRES_DB MINIO_ROOT_USER S3_ACCESS_KEY_ID \
            S3_BUCKET S3_REGION S3_PUBLIC_ENDPOINT STAGING_BIND_IP STAGING_WEB_PORT \
            STAGING_WEB_URL STAGING_API_URL STAGING_DEPLOY_PATH MEDIA_INSPECT_QUEUE
          do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "STAGING_DEPLOYMENT_BLOCKED"
            echo "Missing GitHub Environment staging names:${missing}"
            echo "No host was contacted and no deployment was claimed."
            exit 1
          fi

      - name: Deploy digest-pinned images and run smoke tests
        run: |
          set -eu
          umask 077
          install -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging" "$HOME/.ssh/known_hosts"
          env_file="$(mktemp)"
          {
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'MINIO_ROOT_USER=%s\n' "$MINIO_ROOT_USER"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$MINIO_ROOT_PASSWORD"
            printf 'S3_ACCESS_KEY_ID=%s\n' "$S3_ACCESS_KEY_ID"
            printf 'S3_SECRET_ACCESS_KEY=%s\n' "$S3_SECRET_ACCESS_KEY"
            printf 'S3_BUCKET=%s\n' "$S3_BUCKET"
            printf 'S3_REGION=%s\n' "$S3_REGION"
            printf 'S3_PUBLIC_ENDPOINT=%s\n' "$S3_PUBLIC_ENDPOINT"
            printf 'STAGING_BIND_IP=%s\n' "$STAGING_BIND_IP"
            printf 'STAGING_WEB_PORT=%s\n' "$STAGING_WEB_PORT"
            printf 'MEDIA_INSPECT_QUEUE=%s\n' "$MEDIA_INSPECT_QUEUE"
            printf 'EDITAGENT_API_IMAGE=%s\n' "$(cat supply-chain/digest-api.txt)"
            printf 'EDITAGENT_WEB_IMAGE=%s\n' "$(cat supply-chain/digest-web.txt)"
            printf 'EDITAGENT_MEDIA_WORKER_IMAGE=%s\n' "$(cat supply-chain/digest-media-worker.txt)"
            printf 'EDITAGENT_RENDER_WORKER_IMAGE=%s\n' "$(cat supply-chain/digest-render-worker.txt)"
            printf 'EDITAGENT_AGENT_WORKER_IMAGE=%s\n' "$(cat supply-chain/digest-agent-worker.txt)"
            printf 'EDITAGENT_AI_WORKER_IMAGE=%s\n' "$(cat supply-chain/digest-ai-worker.txt)"
            printf 'EDITAGENT_MINIO_IMAGE=%s\n' "$(cat supply-chain/digest-minio.txt)"
            cat supply-chain/platform-digests.txt
          } > "$env_file"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" "install -d -m 700 '$STAGING_DEPLOY_PATH'"
          scp -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.staging.yaml "$STAGING_SSH_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/compose.staging.yaml"
          scp -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -r infra "$STAGING_SSH_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/infra"
          scp -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$env_file" "$STAGING_SSH_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/staging.env"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "set -eu; cd '$STAGING_DEPLOY_PATH'; set -a; . ./staging.env; set +a; chmod 600 staging.env; ./infra/scripts/staging-deploy.sh; COMPOSE_FILE=compose.staging.yaml STAGING_WEB_URL='$STAGING_WEB_URL' STAGING_API_URL='$STAGING_API_URL' ./infra/scripts/staging-smoke.sh; COMPOSE_FILE=compose.staging.yaml STAGING_API_URL='$STAGING_API_URL' ./infra/scripts/staging-readiness-measure.sh"
          rm -f "$env_file"
