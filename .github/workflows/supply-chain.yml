name: Supply chain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: image ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: web
            dockerfile: apps/web/Dockerfile
          - service: media-worker
            dockerfile: workers/media-worker/Dockerfile
          - service: render-worker
            dockerfile: workers/render-worker/Dockerfile
          - service: agent-worker
            dockerfile: workers/agent-worker/Dockerfile
          - service: ai-worker
            dockerfile: workers/ai-worker/Dockerfile
          - service: object-ingress
            dockerfile: infra/object-ingress/Dockerfile
          - service: postgres
            dockerfile: infra/postgres/Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Image names
        id: names
        run: |
          set -eu
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          local_image="editagent-${{ matrix.service }}:${GITHUB_SHA}"
          remote_image="ghcr.io/${owner}/editagent-${{ matrix.service }}:${GITHUB_SHA}"
          echo "local=${local_image}" >> "${GITHUB_OUTPUT}"
          echo "remote=${remote_image}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        run: |
          set -eu
          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -f "${{ matrix.dockerfile }}" \
            -t "${{ steps.names.outputs.local }}" \
            .

      - name: Install Syft and Trivy
        run: ./infra/scripts/install-supply-chain-tools.sh

      - name: Generate SBOM
        run: |
          set -eu
          syft "${{ steps.names.outputs.local }}" -o spdx-json="sbom-${{ matrix.service }}.spdx.json"
          test -s "sbom-${{ matrix.service }}.spdx.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      - name: Scan image for critical vulnerabilities
        run: trivy image --severity CRITICAL --exit-code 1 "${{ steps.names.outputs.local }}"

      - name: Record scan pass
        run: printf 'pass\n' > "${{ matrix.service }}"

      - name: Upload scan result
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-${{ matrix.service }}
          path: ${{ matrix.service }}

      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${{ steps.names.outputs.local }}" | gzip -1 > "${{ matrix.service }}.tar.gz"

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar.gz

  platform-digests:
    name: platform image digests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Syft and Trivy
        run: ./infra/scripts/install-supply-chain-tools.sh

      - name: Resolve and scan the Redis digest
        run: |
          set -eu
          docker pull redis:7.4-alpine
          redis="$(docker image inspect redis:7.4-alpine --format '{{index .RepoDigests 0}}')"
          printf 'EDITAGENT_REDIS_IMAGE=%s\n' "$redis" > platform-digests.txt
          grep -q '@sha256:' platform-digests.txt
          syft redis:7.4-alpine -o spdx-json=sbom-redis.spdx.json
          test -s sbom-redis.spdx.json
          trivy image --severity CRITICAL --exit-code 1 redis:7.4-alpine
          printf 'pass\n' > redis

      - name: Upload Redis SBOM
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-redis
          path: sbom-redis.spdx.json

      - name: Upload Redis scan result
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-redis
          path: redis

      - name: Upload platform digests
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-platform
          path: platform-digests.txt

  seaweedfs:
    name: image seaweedfs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Syft and Trivy
        run: ./infra/scripts/install-supply-chain-tools.sh

      - name: Pull the approved SeaweedFS digest
        run: docker pull chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d

      - name: Generate SBOM
        run: |
          set -eu
          syft chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d -o spdx-json=sbom-seaweedfs.spdx.json
          test -s sbom-seaweedfs.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-seaweedfs
          path: sbom-seaweedfs.spdx.json

      - name: Scan image for critical vulnerabilities
        run: trivy image --severity CRITICAL --exit-code 1 chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d

      - name: Record scan pass
        run: printf 'pass\n' > seaweedfs

      - name: Upload scan result
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-seaweedfs
          path: seaweedfs

  security-gate:
    name: supply-chain-security
    needs: [images, seaweedfs, platform-digests]
    if: always() && needs.images.result != 'cancelled' && needs.seaweedfs.result != 'cancelled' && needs.platform-digests.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download scan results
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-scan-*
          merge-multiple: true
          path: scan-results
        continue-on-error: true

      - name: Require every image scan to pass
        env:
          SCAN_DIR: scan-results
        run: ./infra/scripts/supply-chain-security-gate.sh

  publish:
    name: publish images
    needs: [security-gate, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.security-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download scan results
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-scan-*
          merge-multiple: true
          path: scan-results

      - name: Download scanned images
        uses: actions/download-artifact@v7
        with:
          pattern: supply-chain-image-*
          merge-multiple: true
          path: scanned-images

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned images
        env:
          SCAN_DIR: scan-results
          IMAGE_DIR: scanned-images
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -eu
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REGISTRY="ghcr.io/${owner}"
          export IMAGE_REGISTRY
          ./infra/scripts/publish-scanned-images.sh

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-digests
          path: scanned-images/digest-*.txt

  deploy:
    name: deploy staging
    needs: [publish, platform-digests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      STAGING_GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      S3_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ${{ vars.S3_REGION }}
      S3_PUBLIC_ENDPOINT: ${{ vars.S3_PUBLIC_ENDPOINT }}
      STAGING_BIND_IP: ${{ vars.STAGING_BIND_IP }}
      STAGING_WEB_PORT: ${{ vars.STAGING_WEB_PORT }}
      STAGING_OBJECTS_PORT: ${{ vars.STAGING_OBJECTS_PORT }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_SILENT_API_URL: ${{ vars.STAGING_SILENT_API_URL }}
      STAGING_GHCR_USER: ${{ vars.STAGING_GHCR_USER }}
      STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
      MEDIA_INSPECT_QUEUE: ${{ vars.MEDIA_INSPECT_QUEUE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download published digests
        uses: actions/download-artifact@v7
        with:
          name: supply-chain-digests
          path: supply-chain

      - name: Download platform digests
        uses: actions/download-artifact@v7
        with:
          name: supply-chain-platform
          path: supply-chain

      - name: Require staging configuration
        run: |
          set -eu
          missing=""
          for name in \
            STAGING_HOST STAGING_SSH_USER STAGING_SSH_KEY STAGING_SSH_KNOWN_HOSTS \
            POSTGRES_PASSWORD S3_SECRET_ACCESS_KEY STAGING_GHCR_TOKEN \
            POSTGRES_USER POSTGRES_DB S3_ACCESS_KEY_ID \
            S3_BUCKET S3_REGION S3_PUBLIC_ENDPOINT STAGING_BIND_IP STAGING_WEB_PORT \
            STAGING_OBJECTS_PORT \
            STAGING_WEB_URL STAGING_API_URL STAGING_SILENT_API_URL \
            STAGING_GHCR_USER STAGING_DEPLOY_PATH MEDIA_INSPECT_QUEUE
          do
            eval "value=\${$name-}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "STAGING_DEPLOYMENT_BLOCKED"
            echo "Missing GitHub Environment staging names:${missing}"
            echo "No host was contacted and no deployment was claimed."
            exit 1
          fi

      - name: Deploy digest-pinned images and run smoke tests
        run: |
          set -euo pipefail
          umask 077
          install -d "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/staging" "$HOME/.ssh/known_hosts"
          env_file="$(mktemp)"
          export EDITAGENT_API_IMAGE="$(cat supply-chain/digest-api.txt)"
          export EDITAGENT_WEB_IMAGE="$(cat supply-chain/digest-web.txt)"
          export EDITAGENT_MEDIA_WORKER_IMAGE="$(cat supply-chain/digest-media-worker.txt)"
          export EDITAGENT_RENDER_WORKER_IMAGE="$(cat supply-chain/digest-render-worker.txt)"
          export EDITAGENT_AGENT_WORKER_IMAGE="$(cat supply-chain/digest-agent-worker.txt)"
          export EDITAGENT_AI_WORKER_IMAGE="$(cat supply-chain/digest-ai-worker.txt)"
          export EDITAGENT_OBJECT_INGRESS_IMAGE="$(cat supply-chain/digest-object-ingress.txt)"
          export EDITAGENT_POSTGRES_IMAGE="$(cat supply-chain/digest-postgres.txt)"
          export EDITAGENT_SEAWEEDFS_IMAGE="chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"
          # shellcheck disable=SC1091
          . ./supply-chain/platform-digests.txt
          python3 infra/scripts/write-staging-env.py "$env_file" \
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB \
            S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_BUCKET S3_REGION S3_PUBLIC_ENDPOINT \
            STAGING_BIND_IP STAGING_WEB_PORT STAGING_OBJECTS_PORT MEDIA_INSPECT_QUEUE \
            EDITAGENT_API_IMAGE EDITAGENT_WEB_IMAGE EDITAGENT_MEDIA_WORKER_IMAGE \
            EDITAGENT_RENDER_WORKER_IMAGE EDITAGENT_AGENT_WORKER_IMAGE EDITAGENT_AI_WORKER_IMAGE \
            EDITAGENT_OBJECT_INGRESS_IMAGE EDITAGENT_POSTGRES_IMAGE EDITAGENT_REDIS_IMAGE \
            EDITAGENT_SEAWEEDFS_IMAGE
          quoted_web="$(printf '%q' "$STAGING_WEB_URL")"
          quoted_api="$(printf '%q' "$STAGING_API_URL")"
          quoted_silent="$(printf '%q' "$STAGING_SILENT_API_URL")"
          quoted_user="$(printf '%q' "$STAGING_GHCR_USER")"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" "install -d -m 700 '$STAGING_DEPLOY_PATH'"
          scp -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            compose.staging.yaml "$STAGING_SSH_USER@$STAGING_HOST:$STAGING_DEPLOY_PATH/compose.staging.yaml"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "rm -rf '$STAGING_DEPLOY_PATH/infra' && mkdir -p '$STAGING_DEPLOY_PATH/infra'"
          tar -C infra -cf - . | ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "tar -C '$STAGING_DEPLOY_PATH/infra' -xf -"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "umask 077; cat > '$STAGING_DEPLOY_PATH/staging.env'" < "$env_file"
          printf '%s' "$STAGING_GHCR_TOKEN" | ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "umask 077; docker login ghcr.io --username $quoted_user --password-stdin"
          ssh -i "$HOME/.ssh/staging" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$STAGING_SSH_USER@$STAGING_HOST" \
            "set -eu; cd '$STAGING_DEPLOY_PATH'; set -a; . ./staging.env; set +a; chmod 600 staging.env; ./infra/scripts/staging-deploy.sh; COMPOSE_FILE=compose.staging.yaml STAGING_WEB_URL=$quoted_web STAGING_API_URL=$quoted_api ./infra/scripts/staging-smoke.sh; COMPOSE_FILE=compose.staging.yaml STAGING_API_URL=$quoted_api STAGING_SILENT_API_URL=$quoted_silent ./infra/scripts/staging-readiness-measure.sh"
          rm -f "$env_file"
