# Disposable SeaweedFS S3 proof of concept.
# This file does not attach MinIO volumes and does not replace compose.yaml.

name: editagent-seaweedfs-spike

services:
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - mini
      - -dir=/data
      - -admin.user=editagent-spike
      - -admin.password=seaweed-spike-admin
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweedfs-spike-data:/data
      - ./infra/seaweedfs-spike/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:18333:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  seaweedfs-spike-data:
