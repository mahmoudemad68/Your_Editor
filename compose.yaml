# EditAgent local runtime (US-114).
# Development placeholders only. Real credentials stay in an untracked .env.
# `docker compose up` starts the non-GPU stack. The NVIDIA runtime is opt-in:
#   docker compose --profile gpu up --scale ai-worker=0
# or `make up-gpu`.

name: editagent

x-database-url: &database-url postgresql://${POSTGRES_USER:-editagent}:${POSTGRES_PASSWORD:-editagent-dev-password}@postgres:5432/${POSTGRES_DB:-editagent}

x-object-storage: &object-storage
  S3_ENDPOINT: http://seaweed-s3:8333
  S3_BUCKET: ${S3_BUCKET:-editagent}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:-editagent}}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:-editagent-dev-secret}}
  S3_REGION: ${S3_REGION:-us-east-1}

x-ai-environment: &ai-environment
  DATABASE_URL: *database-url
  REDIS_URL: redis://redis:6379/0
  <<: *object-storage
  EDITAGENT_AI_DEVICE: cpu

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: editagent-postgres:local
    container_name: editagent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-editagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editagent-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-editagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: infra/redis/Dockerfile
    image: editagent-redis:local
    container_name: editagent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  seaweed-master:
    build:
      context: .
      dockerfile: infra/seaweedfs/Dockerfile
    image: editagent-seaweedfs:local
    container_name: editagent-seaweed-master
    command:
      - master
      - -ip=seaweed-master
      - -ip.bind=0.0.0.0
      - -port=9333
      - -telemetry=false
    networks: [storage_internal]
    volumes:
      - seaweed-master:/data
      - ${SEAWEED_SECRET_DIR:-.local/seaweedfs}/security.toml:/etc/seaweedfs/security.toml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/dir/status"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  seaweed-volume:
    build:
      context: .
      dockerfile: infra/seaweedfs/Dockerfile
    image: editagent-seaweedfs:local
    container_name: editagent-seaweed-volume
    command:
      - volume
      - -mserver=seaweed-master:9333
      - -ip=seaweed-volume
      - -ip.bind=0.0.0.0
      - -port=8080
    networks: [storage_internal]
    volumes:
      - seaweed-volume:/data
      - ${SEAWEED_SECRET_DIR:-.local/seaweedfs}/security.toml:/etc/seaweedfs/security.toml:ro
    depends_on:
      seaweed-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q HTTP/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
    restart: unless-stopped

  seaweed-filer:
    build:
      context: .
      dockerfile: infra/seaweedfs/Dockerfile
    image: editagent-seaweedfs:local
    container_name: editagent-seaweed-filer
    command:
      - filer
      - -master=seaweed-master:9333
      - -ip=seaweed-filer
      - -ip.bind=0.0.0.0
      - -port=8888
      - -disableDirListing
    networks: [storage_internal]
    volumes:
      - seaweed-filer:/data
      - ${SEAWEED_SECRET_DIR:-.local/seaweedfs}/security.toml:/etc/seaweedfs/security.toml:ro
    depends_on:
      seaweed-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8888/ 2>&1 | grep -q HTTP/"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
    restart: unless-stopped

  seaweed-s3:
    build:
      context: .
      dockerfile: infra/seaweedfs/Dockerfile
    image: editagent-seaweedfs:local
    container_name: editagent-seaweed-s3
    command:
      - s3
      - -filer=seaweed-filer:8888
      - -ip.bind=0.0.0.0
      - -port=8333
      - -port.iceberg=0
      - -port.lance=0
      - -iam=false
      - -config=/etc/seaweedfs/s3.json
    networks: [storage_internal, default]
    ports:
      - "127.0.0.1:${S3_PORT:-${MINIO_PORT:-9000}}:8333"
    volumes:
      - ${SEAWEED_SECRET_DIR:-.local/seaweedfs}/security.toml:/etc/seaweedfs/security.toml:ro
      - ${SEAWEED_SECRET_DIR:-.local/seaweedfs}/s3.json:/etc/seaweedfs/s3.json:ro
    depends_on:
      seaweed-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: editagent-api:local
    container_name: editagent-api
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      PORT: "3001"
      HOST: "0.0.0.0"
      <<: *object-storage
      S3_PUBLIC_ENDPOINT: http://localhost:${S3_PORT:-${MINIO_PORT:-9000}}
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: "no"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: editagent-web:local
    container_name: editagent-web
    environment:
      API_BASE_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: "no"

  agent-worker:
    build:
      context: .
      dockerfile: workers/agent-worker/Dockerfile
    image: editagent-agent-worker:local
    container_name: editagent-agent-worker
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Compose health is process startup (the ready file), not HTTP /ready.
    # HTTP /health is liveness. HTTP /ready means the process can accept work.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/tmp/editagent.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  media-worker:
    build:
      context: .
      dockerfile: workers/media-worker/Dockerfile
    image: editagent-media-worker:local
    container_name: editagent-media-worker
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    # Compose health is process startup (the ready file), not HTTP /ready.
    # HTTP /health is liveness. HTTP /ready means the process can accept work.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/tmp/editagent.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  render-worker:
    build:
      context: .
      dockerfile: workers/render-worker/Dockerfile
    image: editagent-render-worker:local
    container_name: editagent-render-worker
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      <<: *object-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    # Compose health is process startup (the ready file), not HTTP /ready.
    # HTTP /health is liveness. HTTP /ready means the process can accept work.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/tmp/editagent.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  ai-worker:
    build:
      context: .
      dockerfile: workers/ai-worker/Dockerfile
    image: editagent-ai-worker:local
    container_name: editagent-ai-worker
    environment: *ai-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import os,sys; sys.exit(0 if os.path.isfile('/tmp/editagent.ready') else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  # Optional GPU profile. `docker compose up` does not start this service.
  # GPU access is a Compose device reservation. Compose v2.32.4 rejects a scalar
  # GPU field, so this service uses deploy.resources.reservations.devices.
  ai-worker-gpu:
    profiles: ["gpu"]
    image: editagent-ai-worker:local
    build:
      context: .
      dockerfile: workers/ai-worker/Dockerfile
    container_name: editagent-ai-worker-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      <<: *ai-environment
      EDITAGENT_AI_DEVICE: cuda
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import os,sys; sys.exit(0 if os.path.isfile('/tmp/editagent.ready') else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

networks:
  storage_internal:
    internal: true
    driver: bridge
    enable_ipv6: false

volumes:
  postgres-data:
  redis-data:
  # Historical MinIO bytes. No service mounts this volume. Do not remove it
  # with `docker compose down -v` until a separate decision drops that history.
  minio-data:
  seaweed-master:
  seaweed-volume:
  seaweed-filer:
